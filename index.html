const TH_MONTH_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                       'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
/* ในชีตเก็บวันที่เป็น พ.ศ. อยู่แล้ว ถ้าเจอปีน้อยกว่า 2400 ถือว่าเป็น ค.ศ. จึงบวกให้ */
function beYear(y){ y = Number(y)||0; return y < 2400 ? y + 543 : y; }
function thaiDate(iso){
  const s = String(iso || '').slice(0,10);
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(!m) return s || '-';
  return Number(m[3]) + ' ' + TH_MONTH_FULL[Number(m[2])-1] + ' ' + beYear(m[1]);
}
const TH_MONTH_ABBR = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.',
                       'ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thaiDateShort(iso){
  const s = String(iso || '').slice(0,10);
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(!m) return s || '-';
  return Number(m[3]) + ' ' + TH_MONTH_ABBR[Number(m[2])-1] + ' ' + beYear(m[1]);
}

async function openPayReport(jobId, no){
  openSheet('รายงานเบิกจ่ายเงิน', 'งวดที่ ' + no, `
    <div id="prBody"><div class="card"><div class="sub">กำลังรวบรวมข้อมูล…</div></div></div>`);
  try{
    const r = await tree2('payReport', {jobId, installment: no});
    window.__payReport = r;
    payReportForm(r);
  }catch(e){
    $('#prBody').innerHTML = `<div class="card"><div class="sub">${esc(e.message)}</div></div>`;
  }
}

function payReportForm(r){
  const cm = r.committee || [];
  const needDoc = !r.docNo;
  $('#prBody').innerHTML = `
    <div class="card">
      <div class="kanit" style="font-size:17px">${esc(r.job.MJMNo || r.job.JobID)}</div>
      <div class="sub">${esc(r.job.JobName || '')}</div>
      <div style="margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px">
        <div class="sub">งวดที่</div><div>${esc(r.installment)} · ร้อยละ ${esc(r.percent)}</div>
        <div class="sub">จำนวนเงิน</div><div style="font-weight:600">${fmt0(r.amount)} บาท</div>
        <div class="sub">ราคาตามสัญญา</div><div>${fmt0(r.contractPrice)} บาท</div>
        <div class="sub">ตัดแล้ว</div><div>${esc(r.cutCount)} จาก ${esc(r.lineCount)} ไลน์</div>
        <div class="sub">วันตรวจรับ</div><div>${esc(r.round && r.round.AcceptDate ? thaiDate(r.round.AcceptDate) : 'ยังไม่ตรวจรับ')}</div>
        <div class="sub">เลขหนังสือ</div><div>${r.docNoFull ? esc(r.docNoFull) : '<span style="color:var(--warn)">ยังไม่ได้ออกเลข</span>'}</div>
      </div>
    </div>

    <div class="card">
      <div class="plabel">คณะกรรมการตรวจรับ ปี ${esc(r.job.Year)}</div>
      ${cm.length ? cm.map(c => `<div style="display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line2)">
          <div style="flex:1"><div style="font-size:13.5px;font-weight:600">${esc(c.Name || '(ยังไม่ได้ใส่ชื่อ)')}</div>
          <div class="sub">${esc(c.Position || '')}</div></div>
          <span class="pill ${String(c.Role).indexOf('ประธาน')>=0 ? 'p-ok' : 'p-gray'}">${esc(c.Role)}</span>
        </div>`).join('')
        : '<div class="sub">ยังไม่ได้ใส่รายชื่อของปีนี้</div>'}
      <button class="btn ghost" style="margin-top:10px;width:100%;height:38px"
        onclick="openCommittee('${esc(r.job.Year)}')">แก้รายชื่อคณะกรรมการ</button>
    </div>

    <div class="card">
      ${needDoc ? `
        <button class="btn" style="width:100%;height:46px" id="prDoc" onclick="payIssueDoc('${esc(r.job.JobID)}', ${Number(r.installment)})"
          ${r.canIssue && r.bookReady ? '' : 'disabled'}>ออกเลขหนังสือจากระบบทะเบียน</button>
        <div class="sub" style="margin-top:8px">
          ${!r.bookReady ? 'ยังไม่ได้ตั้งค่า BOOKNO_URL และ BOOKNO_KEY ในแท็บ Config'

      <div class="sub" style="margin-top:8px">พิมพ์ได้โดยไม่ต้องมีเลขหนังสือ ช่องเลขที่จะเว้นว่างไว้ให้เขียนมือ</div>
    </div>`;
}

async function payIssueDoc(jobId, no){
  const b = $('#prDoc');
  if(b){ b.disabled = true; b.textContent = 'กำลังขอเลข…'; }
  try{
    const out = await tree2('payDocNo', {jobId, no});
    markDirty();
    toast('ได้เลขหนังสือ ' + (out.docNoFull || out.docNo));
    const r = await tree2('payReport', {jobId, installment: no});
    window.__payReport = r;
    payReportForm(r);
  }catch(e){
    toast(e.message, 5000);
    if(b){ b.disabled = false; b.textContent = 'ออกเลขหนังสือจากระบบทะเบียน'; }
  }
}

function payPrint(){
  const r = window.__payReport;
  if(!r){ toast('ยังไม่มีข้อมูล'); return; }
  const w = window.open('', '_blank');
  if(!w){ toast('เบราว์เซอร์ปิดกั้นหน้าต่างใหม่ กรุณาอนุญาตแล้วลองอีกครั้ง'); return; }
  w.document.write(payReportHtml(r));
  w.document.close();
}

function payReportHtml(r){
  const j = r.job || {};
  const cm = (r.committee || []).filter(c => String(c.Name || '').trim() !== '');
  const sg = r.signers || {};
  const before = (r.photos || []).filter(p => String(p.kind).indexOf('ก่อน') >= 0).slice(0, 6);
  const after  = (r.photos || []).filter(p => String(p.kind).indexOf('หลัง') >= 0).slice(0, 6);
  const cut = (r.lines || []).filter(l => l.cutDate);

  const sign = (name, pos, label) => `
    <div class="sg">
      <div class="ln">(ลงชื่อ)…………………………………………</div>
      <div class="nm">( ${esc(name || '…………………………………………')} )</div>
      <div class="ps">${esc(pos || '')}</div>
      ${label ? `<div class="ps">${esc(label)}</div>` : ''}
    </div>`;

  return `<!doctype html><html lang="th"><head><meta charset="utf-8">
<title>รายงานเบิกจ่าย ${esc(j.MJMNo || '')} งวดที่ ${esc(r.installment)}</title>
<style>
  @page { size: A4; margin: 18mm 18mm 16mm; }
  * { box-sizing: border-box; }
  body { font-family: "TH Sarabun New","Sarabun","Leelawadee UI","Tahoma",sans-serif;
         font-size: 16pt; line-height: 1.5; color: #000; margin: 0; }
  .seal { width: 26mm; display: block; margin: 0 auto 4mm; }
  h1 { font-size: 18pt; text-align: center; margin: 0 0 2mm; font-weight: 700; }
  .sub { text-align: center; font-size: 15pt; margin: 0 0 6mm; }
  .docno { text-align: right; font-size: 15pt; margin-bottom: 4mm; }
  table { width: 100%; border-collapse: collapse; margin: 3mm 0 5mm; font-size: 15pt; }
  th, td { border: 1px solid #000; padding: 1.2mm 2.2mm; vertical-align: top; }
  th { background: #EFEAF3; font-weight: 700; text-align: center; }
  td.n { text-align: right; }
  td.c { text-align: center; }
  td.nw, th.nw { white-space: nowrap; }
  .kv td { border: none; padding: 0.8mm 0; }
  .kv td:first-child { width: 46mm; color: #333; white-space: nowrap; }
  h2 { font-size: 16pt; margin: 6mm 0 2mm; font-weight: 700;
       break-after: avoid; page-break-after: avoid; }
  tr, figure { break-inside: avoid; page-break-inside: avoid; }
  .amt { font-weight: 700; }
  .signs { display: flex; flex-wrap: wrap; gap: 7mm 4mm; margin-top: 9mm;
           break-inside: avoid; page-break-inside: avoid; }
  .sg { flex: 1 1 46%; text-align: center; font-size: 15pt;
        break-inside: avoid; page-break-inside: avoid; }
  .sg .ln { margin-bottom: 1.5mm; }
  .sg .nm { }
  .sg .ps { color: #222; }
  .pg { page-break-before: always; }
  .pics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4mm; }
  .pics figure { margin: 0; }
  .pics img { width: 100%; height: 42mm; object-fit: cover; border: 1px solid #999; }
  .pics figcaption { font-size: 13pt; text-align: center; }
  .note { font-size: 14pt; color: #333; }
  @media print { .noprint { display: none; } }
  @media screen { body { max-width: 210mm; margin: 0 auto; padding: 16mm 18mm 20mm;
                         background: #fff; box-shadow: 0 0 0 100vmax #EFECE5; } }
  .noprint { text-align: center; margin-bottom: 6mm; }
  .noprint button { font: inherit; padding: 2mm 6mm; cursor: pointer; }
</style></head><body>
<div class="noprint"><button onclick="window.print()">สั่งพิมพ์</button></div>

<img class="seal" src="${PEA_SEAL}" alt="ตราการไฟฟ้าส่วนภูมิภาค">
<h1>เอกสารแนบท้ายบันทึก</h1>
<div class="sub">รายงานผลการตรวจรับงานจ้างเหมาตัดต้นไม้ใกล้แนวระบบจำหน่าย<br>
และขออนุมัติเบิกจ่ายเงิน งวดที่ ${esc(r.installment)}</div>
<div class="docno">เลขที่ ${esc(r.docNoFull || '……………………')}${r.docDate ? ' &nbsp; ลงวันที่ ' + esc(thaiDate(r.docDate)) : ''}</div>

<table class="kv">
  <tr><td>หน่วยงาน</td><td>${esc(r.org)}</td></tr>
  <tr><td>เลขที่ใบงาน</td><td>${esc(j.MJMNo || j.JobID)}</td></tr>
  <tr><td>ชื่องาน</td><td>${esc(j.JobName || '')}</td></tr>
  <tr><td>ระบบ / ระดับแรงดัน</td><td>${esc(j.System || '')} ${esc(j.VoltLevel || '')}</td></tr>
  <tr><td>ฟีดเดอร์</td><td>${esc(j.FeederID || '')}</td></tr>
  <tr><td>ระยะทางตามแผน</td><td>${esc(j.PlanKm || '')} กิโลเมตร</td></tr>
  <tr><td>ผู้รับจ้าง</td><td>${esc(j.Contractor || '')}</td></tr>
  <tr><td>เลขที่ ZPM4</td><td>${esc(j.ZPM4No || '-')}</td></tr>
  <tr><td>วันที่ตรวจรับงาน</td><td>${esc(r.round && r.round.AcceptDate ? thaiDate(r.round.AcceptDate) : '……………………')}</td></tr>
  <tr><td>ผู้ควบคุมงาน</td><td>${esc((r.round && r.round.Inspector) || sg.supervisorName || '……………………')}</td></tr>
</table>

<h2>๑. ผลการดำเนินงาน</h2>
<p>ผู้รับจ้างได้ดำเนินการตัดต้นไม้ใกล้แนวระบบจำหน่ายตามใบงานข้างต้น รอบที่ ${esc(r.installment)}
แล้วเสร็จจำนวน ${esc(r.cutCount)} ไลน์ จากทั้งหมด ${esc(r.lineCount)} ไลน์
คณะกรรมการได้ตรวจรับงานแล้วเห็นว่าถูกต้องครบถ้วนตามรูปแบบและข้อกำหนดของการไฟฟ้าส่วนภูมิภาค</p>

<h2>๒. จำนวนเงินที่ขอเบิกจ่าย</h2>
<table>
  <thead><tr><th style="width:18mm">งวดที่</th><th>รายการ</th><th style="width:20mm">ร้อยละ</th><th style="width:34mm">จำนวนเงิน (บาท)</th></tr></thead>
  <tbody>
    <tr><td class="c">${esc(r.installment)}</td>
        <td>ค่าจ้างเหมาตัดต้นไม้ใกล้แนวระบบจำหน่าย ใบงาน ${esc(j.MJMNo || '')}</td>
        <td class="c">${esc(r.percent)}</td>
        <td class="n amt">${fmt(r.amount)}</td></tr>
    <tr><td colspan="3" style="text-align:right;font-weight:700">รวมเป็นเงินทั้งสิ้น</td>
        <td class="n amt">${fmt(r.amount)}</td></tr>
  </tbody>
</table>
<p>(${esc(r.amountText)})</p>
<p class="note">คิดจากราคาตามสัญญา ${fmt(r.contractPrice)} บาท แบ่งจ่ายสามงวด ร้อยละ 40, 40 และ 20 ตามลำดับ</p>

<h2>๓. รายการไลน์ที่ดำเนินการแล้ว</h2>
${cut.length ? `<table>
  <thead><tr><th style="width:13mm">ลำดับ</th><th style="width:36mm">รหัสไลน์</th><th>สถานที่</th><th style="width:26mm">วันที่ตัด</th><th style="width:32mm">ผู้บันทึก</th></tr></thead>
  <tbody>${cut.map((l,i) => `<tr><td class="c">${i+1}</td><td class="nw">${esc(l.lineCode)}</td>
    <td>${esc(l.placeName || '')}</td><td class="c nw">${esc(thaiDateShort(l.cutDate))}</td>
    <td class="nw">${esc(l.by || '')}</td></tr>`).join('')}</tbody></table>`
  : '<p class="note">ยังไม่มีรายการไลน์ที่บันทึกวันตัดของรอบนี้</p>'}

<h2>๔. ความเห็นของคณะกรรมการตรวจรับ</h2>
<p>คณะกรรมการตรวจรับได้ตรวจสอบผลงานแล้ว เห็นควรอนุมัติเบิกจ่ายเงินให้แก่ผู้รับจ้างตามจำนวนข้างต้น</p>

<div class="signs">
  ${cm.length ? cm.map(c => sign(c.Name, c.Position, c.Role)).join('')
    : sign('', '', 'ประธานกรรมการ') + sign('', '', 'กรรมการ') + sign('', '', 'กรรมการ')}
</div>

<div class="signs" style="margin-top:14mm">
  ${sign((r.round && r.round.Inspector) || sg.supervisorName, sg.supervisorPos || 'ผู้ควบคุมงาน', '')}
  ${sign(sg.managerName, sg.managerPos || 'ผู้จัดการ', '')}
</div>

${(before.length || after.length) ? `
<div class="pg">
  <h2 style="margin-top:0">ภาคผนวก ภาพถ่ายประกอบการตรวจรับ</h2>
  ${before.length ? `<h2>ก่อนดำเนินการ</h2><div class="pics">
    ${before.map(p => `<figure><img src="${esc(p.url)}" alt="ภาพก่อนดำเนินการ">
      <figcaption>${esc(p.lineCode || '')}</figcaption></figure>`).join('')}</div>` : ''}
  ${after.length ? `<h2>หลังดำเนินการ</h2><div class="pics">
    ${after.map(p => `<figure><img src="${esc(p.url)}" alt="ภาพหลังดำเนินการ">
      <figcaption>${esc(p.lineCode || '')}</figcaption></figure>`).join('')}</div>` : ''}
</div>` : ''}

</body></html>`;
}

/* ---------- 3. รายชื่อคณะกรรมการ แยกตามปี ---------- */
let CMM = { year:'', rows:[] };

async function openCommittee(year){
  CMM.year = String(year || S.year);
  openSheet('คณะกรรมการตรวจรับ', 'ปี ' + CMM.year, `<div id="cmBody"><div class="card"><div class="sub">กำลังโหลด…</div></div></div>`);
  try{
    const out = await tree2('committeeGet', {year: CMM.year});
    CMM.rows = (out.rows || []).map(r => ({
      name: r.Name || '', position: r.Position || '', role: r.Role || 'กรรมการ'
    }));
    if(!CMM.rows.length) CMM.rows = [{name:'',position:'',role:'ประธาน'},
                                     {name:'',position:'',role:'กรรมการ'},
                                     {name:'',position:'',role:'กรรมการ'}];
    committeeRender();
  }catch(e){ $('#cmBody').innerHTML = `<div class="card"><div class="sub">${esc(e.message)}</div></div>`; }
}

function committeeRender(){
  $('#cmBody').innerHTML = `
    <div class="card">
      <div class="sub" style="margin-bottom:10px">ประธานหนึ่งคน ที่เหลือเป็นกรรมการ เพิ่มหรือลดได้ตามคำสั่งแต่งตั้งของแต่ละปี</div>
      ${CMM.rows.map((c,i) => `
        <div style="padding:10px 0;border-top:1px solid var(--line2)">
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
            <span class="pill ${c.role.indexOf('ประธาน')>=0?'p-ok':'p-gray'}">คนที่ ${i+1}</span>
            <select class="inp" style="flex:1;height:34px" onchange="CMM.rows[${i}].role=this.value;committeeRender()">
              <option ${c.role.indexOf('ประธาน')>=0?'selected':''}>ประธาน</option>
              <option ${c.role.indexOf('ประธาน')>=0?'':'selected'}>กรรมการ</option>
            </select>
            <button class="btn ghost" style="height:34px;padding:0 10px" onclick="CMM.rows.splice(${i},1);committeeRender()">ลบ</button>
          </div>
          <input class="inp" style="width:100%;margin-bottom:6px" placeholder="ชื่อ นามสกุล"
            value="${esc(c.name)}" oninput="CMM.rows[${i}].name=this.value">
          <input class="inp" style="width:100%" placeholder="ตำแหน่ง เช่น หัวหน้าแผนกปฏิบัติการระบบไฟฟ้า"
            value="${esc(c.position)}" oninput="CMM.rows[${i}].position=this.value">
        </div>`).join('')}
      <button class="btn ghost" style="margin-top:12px;width:100%;height:38px"
        onclick="CMM.rows.push({name:'',position:'',role:'กรรมการ'});committeeRender()">เพิ่มกรรมการ</button>
      <button class="btn" style="margin-top:10px;width:100%;height:44px" onclick="committeeSave()">บันทึกรายชื่อปี ${esc(CMM.year)}</button>
    </div>`;
}

async function committeeSave(){
  const list = CMM.rows.filter(c => String(c.name).trim() !== '');
  if(!list.length){ toast('ยังไม่ได้ใส่ชื่อ'); return; }
  const chair = list.filter(c => c.role.indexOf('ประธาน') >= 0);
  if(chair.length !== 1){ toast('ต้องมีประธานหนึ่งคนเท่านั้น'); return; }
  try{
    await tree2('committeeSave', {year: CMM.year, members: list});
    markDirty();
    toast('บันทึกรายชื่อปี ' + CMM.year + ' แล้ว');
    closeSheet();
  }catch(e){ toast(e.message, 4500); }
}

/* ============ เริ่มทำงาน ============ */
(function init(){
  const a = localStorage.getItem(LS+'_auth');
  if(a){
    try{
      const o = JSON.parse(a);
      S.user = o.user; S.token = o.token;
      startApp().then(()=>{ flushQueue(); logAppOpen(); });
      return;
    }catch(e){ /* ข้อมูลเสีย ให้เข้าสู่ระบบใหม่ */ }
  }
  const c = hubCreds();
  if(c.name) $('#uname').value = c.name;
  let skip = false;
  try{ skip = !!sessionStorage.getItem('tree_skipauto'); }catch(e){}
  if(!skip && c.name && c.pass){
    splash('กำลังเข้าสู่ระบบด้วยบัญชีศูนย์รวมงาน…');
    autoLogin(c.name, c.pass);
  }else{
    showLogin();
  }
})();
</script>
