<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- ตั้งค่าเดียวกับแอปอื่นในศูนย์รวมงาน — เวลาเพิ่มลงหน้าจอโฮม ไอโฟนจะเปิดเต็มจอ
     ถ้าไม่มีบรรทัดเหล่านี้ ไอโฟนจะกันพื้นที่แถบสถานะด้านบนและขอบล่างไว้ กลายเป็นแถบขาว -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ตัดต้นไม้">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4b2e83">
<!-- ไอคอนตอนเพิ่มลงหน้าจอโฮม ใช้ไฟล์ที่มีอยู่แล้วใน repo tree-ala -->
<link rel="apple-touch-icon" sizes="180x180" href="tree-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="tree-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="tree-icon-512.png">
<title>งานตัดต้นไม้ กฟส.อ่าวลึก</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#1A1A18; --muted:#5F5C55; --dim:#75716A;
  --ground:#F6F5F1; --card:#FFFFFF; --line:#E3E0D8; --line2:#EFECE5;
  --pea:#4A1D62; --pea2:#6D2E8E; --pea-soft:#EFE7F5;
  --ok:#2F7A55; --ok-soft:#E6F1EA; --warn:#C98A16; --warn-soft:#FBF0D8;
  --bad:#B4402E; --bad-soft:#F7E7E3; --gray:#9A958C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--ground);color:var(--ink);font-size:14px}
h1,h2,h3,.kanit{font-family:'Kanit',sans-serif;font-weight:600;margin:0}
button,input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--pea2);text-decoration:none}
.hide{display:none !important}

/* --- login --- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ground);
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
.loginbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brandmark{width:44px;height:44px;border-radius:12px;background:var(--pea);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Kanit';font-size:16px}

/* --- shell --- */
.topbar{background:var(--pea);color:#fff;padding:9px 20px;min-height:58px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40}
.tb-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.tb-text{min-width:0}
.topbar .t{font-family:'Kanit';font-weight:500;font-size:16px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .t2{font-size:11px;color:#D6C6E4;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.chipyear{display:flex;gap:4px;background:#5D2C78;padding:3px;border-radius:10px}
.chipyear button{border:0;background:transparent;color:#E7DDF0;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px;white-space:nowrap}
.chipyear button.on{background:#fff;color:var(--pea);font-weight:600}
.iconbtn{width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid #7A4C97;border-radius:10px;background:transparent;color:#E7DDF0;cursor:pointer;flex-shrink:0}
.iconbtn:hover{background:#5D2C78}
/* --- หน้ารอโหลด --- */
#splash{position:fixed;inset:0;background:var(--ground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:80}
.spin{width:42px;height:42px;border-radius:999px;border:3px solid #E0DAE6;border-top-color:var(--pea);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.splash-brand{display:flex;align-items:center;gap:10px}
.tabs{background:var(--card);border-bottom:1px solid var(--line);padding:0 20px;display:flex;gap:22px;position:sticky;top:58px;z-index:39;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:14px 0;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.on{color:var(--pea);font-weight:600;border-bottom-color:var(--pea)}
#app{display:flex;flex-direction:column;min-height:100vh}
main{flex:1;padding:20px;background:var(--ground)}
.grid{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.kpi .n{font-family:'Kanit';font-size:30px;font-weight:600;line-height:1.2}
.lbl{font-size:12px;color:var(--dim)}
.sub{font-size:12px;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:#EDEAE3;display:flex;gap:2px;overflow:hidden}
.bar>i{display:block;border-radius:5px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:#245F42}
.p-warn{background:var(--warn-soft);color:#7A5A10}
.p-bad{background:var(--bad-soft);color:#8A2E20}
.p-gray{background:#EEECE6;color:var(--muted)}
.p-mv{background:var(--pea-soft);color:var(--pea)}
.p-hv{background:#F3E7EF;color:#7A2A5E}
.p-lv{background:#E9F0F6;color:#2A506E}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--muted);text-align:left;padding:10px;border-bottom:1px solid var(--line);background:#FBFAF7;position:sticky;top:0}
td{font-size:13px;padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click:hover{background:#FBF8FD;cursor:pointer}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.inp,select.inp{height:44px;padding:0 12px;border:1px solid #DDD9CF;border-radius:10px;background:#fff}
.btn{height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--pea);color:#fff;font-weight:600;cursor:pointer}
.btn.ghost{background:#fff;border:1px solid #DDD9CF;color:var(--ink);font-weight:400}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.55;cursor:default}
#v-map{position:relative;display:flex;flex-direction:column;height:calc(100vh - 116px);min-height:460px}
#map{flex:1;min-height:300px;border-radius:12px;overflow:hidden}
.mapbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:12px}
.mapctl{display:contents}
.mapbar select{height:40px;padding:0 10px;border:1px solid #DDD9CF;border-radius:9px;background:#fff;font-size:13px}
.mapbar .sum{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.modeseg{display:flex;gap:4px;background:#EFEDE6;padding:3px;border-radius:9px}
.modeseg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--muted)}
.modeseg button.on{background:#fff;color:var(--pea);font-weight:600}
.maplegend{position:absolute;left:12px;bottom:12px;z-index:20;background:rgba(255,255,255,.96);padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:12px;line-height:1.9;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.maplegend i{display:inline-block;width:20px;height:5px;border-radius:3px;vertical-align:middle;margin-right:7px}
/* --- ชั้นกำลังโหลด --- */
.busy{position:absolute;inset:0;background:rgba(246,245,241,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:70;text-align:center;padding:24px}
.busy .msg{font-family:'Kanit',sans-serif;font-size:16px;font-weight:500}
.tipbox{max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;text-align:left}
.tipbox .k{font-size:11px;font-weight:600;color:var(--pea);white-space:nowrap}
.tipbox .v{font-size:12px;color:var(--muted);line-height:1.6}
/* --- modal --- */
.mask{position:fixed;inset:0;background:rgba(26,26,24,.45);display:flex;justify-content:flex-end;z-index:60}
.sheet{width:min(720px,100%);background:var(--ground);height:100%;overflow:auto}
.sheethead{background:var(--pea);color:#fff;padding:16px 20px;display:flex;gap:12px;align-items:flex-start;position:sticky;top:0;z-index:2}
.sheethead button{border:0;background:transparent;color:#fff;font-size:22px;cursor:pointer;line-height:1}
.fieldrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
.field .inp{width:100%}
/* ===== โหมดตรวจหน้าจอ เปิดด้วยการต่อท้าย URL ว่า ?diag=1 ===== */
html.diag,html.diag body{background:#FFFFFF !important}
html.diag #app{outline:4px solid #00D900;outline-offset:-4px}
html.diag .bottomnav{background:#FFF59D !important}
#diagbox{display:none}
html.diag #diagbox{display:block;position:fixed;left:10px;right:10px;top:50%;transform:translateY(-50%);
  background:rgba(0,0,0,.9);color:#fff;padding:16px;border-radius:14px;z-index:200;
  font-size:15px;line-height:1.9;text-align:center;font-family:'IBM Plex Sans Thai',sans-serif}
html.diag #diagbox b{font-size:17px;color:#FFE082}
html.diag #diagbox .note{font-size:12.5px;color:#C9C6C0;line-height:1.7;margin-top:10px;text-align:left}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2F2A34;color:#fff;padding:12px 20px;border-radius:12px;z-index:90;font-size:13px}
/* --- การ์ดขั้นตอนงาน + แถบเกร็ดการใช้งาน (ท้ายหน้าสรุป) --- */
.stepgrp{font-size:11px;color:var(--dim);margin:14px 0 2px}
.steps{display:flex;align-items:flex-start}
.stp{flex:1;min-width:0;text-align:center;position:relative}
.stp .bar{position:absolute;top:14px;left:50%;right:-50%;height:3px;background:#EDEAE3}
.stp .dot{position:relative;z-index:1;width:30px;height:30px;border-radius:999px;margin:0 auto 7px;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;
  background:#EDEAE3;color:#8A857C;border:2px solid #EDEAE3}
.stp.done .bar{background:var(--ok)}
.stp.done .dot{background:var(--ok);color:#fff;border-color:var(--ok)}
.stp.now .dot{background:#fff;color:var(--warn);border-color:var(--warn)}
.stp .n{font-size:11px;font-weight:600;line-height:1.3;word-break:break-word}
.stp .m{font-size:10px;color:var(--dim);margin-top:1px;font-variant-numeric:tabular-nums}
.nextrow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
  background:transparent;border:0;padding:0;cursor:pointer;font-family:inherit;color:inherit}
.nextrow .ic{width:26px;height:26px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:700;background:var(--warn-soft);color:#7A5A10}
.nextrow .t{font-size:13.5px;font-weight:600;line-height:1.45}
.nextrow .d{font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px}
.nextrow .cv{margin-left:auto;color:#B6B1A7;flex-shrink:0;align-self:center}
.tipbar{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  background:#FBF4E4;border:1px solid #EAD9AE;border-radius:14px;padding:13px 14px;font-family:inherit}
.tipbar .k{font-size:11px;font-weight:600;color:#8A6512}
.tipbar .v{font-size:12.5px;color:#6B5210;line-height:1.65;margin-top:3px}
.tipdots{display:flex;gap:4px;margin-top:9px}
.tipdots i{width:5px;height:5px;border-radius:99px;background:#D9C58E;display:block;transition:width .2s}
.tipdots i.on{background:#8A6512;width:14px}
.ic-n{width:24px;height:24px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:600;background:var(--pea-soft);color:var(--pea)}
.cv{flex-shrink:0}
.verline{text-align:center;margin:14px 0 2px;font-size:11px;color:var(--dim);opacity:.8;line-height:1.7}
.bottomnav{display:none}
@media (max-width:760px){
  /* โครงแบบแอป — ตรึงเต็มจอที่มองเห็นจริง ให้เลื่อนเฉพาะเนื้อหาข้างใน
     ไม่ใช้ 100vh เพราะบนมือถือ 100vh รวมพื้นที่ใต้แถบ URL ด้วย
     ทำให้หน้าสูงเกินจอ เลื่อนทั้งหน้าได้ และเหลือที่ว่างด้านล่าง */
  /* พื้นหลังหน้าเว็บเป็นสีขาว — สำคัญบนไอโฟน เพราะพื้นที่ขอบล่างที่ระบบกันไว้
     (นอกตัวหน้าเว็บ) ไอโฟนจะทาสีด้วยสีพื้นหลังของหน้านี้ ถ้าเป็นสีขาวจะกลืนกับเมนูล่าง
     ส่วนพื้นสีครีมเดิมย้ายไปไว้ที่ตัวเนื้อหาแทน */
  html,body{height:100%;overscroll-behavior:none;background:#FFFFFF}
  /* ความสูงจริงที่ตาเห็น วัดด้วย JS (--vh) เชื่อถือได้กว่าทั้ง 100vh และ 100dvh
     เพราะครอบคลุมทั้งเปิดจากหน้าจอโฮม เปิดในซาฟารี และตอนแป้นพิมพ์ขึ้น */
  #app{position:fixed;top:0;left:0;right:0;bottom:auto;min-height:0;
       height:var(--vh, 100dvh);overflow:hidden}
  #splash{background:var(--ground)}
  .topbar{position:static;flex-shrink:0;padding:8px 12px;gap:8px;
          padding-top:calc(8px + env(safe-area-inset-top))}
  /* แถบหัวบนมือถือแคบ — ย่อปุ่มและซ่อนคำว่า "25" ของปี เพื่อให้ชื่อแอปไม่ถูกตัด
     ปุ่มกลับศูนย์รวมงานซ่อนบนมือถือ ใช้ปุ่มย้อนกลับของเบราว์เซอร์แทน */
  .topbar .t{font-size:15px}
  .topbar .t2{font-size:10.5px}
  .chipyear{padding:2px;gap:2px}
  .chipyear button{padding:6px 9px;font-size:12px}
  .chipyear .ypre{display:none}
  .iconbtn{width:34px;height:34px}
  .iconbtn.home{display:none}
  .tb-right{gap:6px}
  .tabs{display:none}
  main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
       -webkit-overflow-scrolling:touch;padding:14px 14px 18px}
  .bottomnav{display:flex;flex-shrink:0;background:#fff;border-top:1px solid var(--line);
              padding:8px 8px var(--navpad, calc(8px + env(safe-area-inset-bottom)))}
  .bottomnav button{flex:1;border:0;background:transparent;padding:6px 0;color:#8A867E;font-size:11px;cursor:pointer}
  .bottomnav button.on{color:var(--pea);font-weight:600}
  .bottomnav svg{display:block;margin:0 auto 3px}
  /* แผนที่สูงเท่าที่เหลือพอดี ไม่ต้องคำนวณจากความสูงจอ */
  #v-map{height:100%;min-height:0}
  #map{min-height:220px}
  /* ตัวกรองแผนที่บนมือถือ — เรียงแถวเดียวแล้วเลื่อนซ้ายขวา
     แทนที่จะตกบรรทัดสี่แถวจนกินพื้นที่แผนที่ */
  .mapbar{gap:6px;padding-bottom:8px;flex-wrap:nowrap;flex-direction:column;align-items:stretch}
  /* overscroll-behavior กันไม่ให้การเลื่อนแถวนี้ไปชนขอบจอ
     แล้วไอโฟนเข้าใจผิดว่าเป็นการปัดย้อนกลับ (จะมีแถบเทาลูกศรโผล่มา) */
  .mapctl{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;
          overscroll-behavior-x:contain;touch-action:pan-x;
          scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .mapctl::-webkit-scrollbar{display:none}
  .mapctl > *{flex-shrink:0}
  .mapbar select{height:34px;font-size:12px;padding:0 8px}
  .mapbar .modeseg button{padding:6px 10px}
  .mapbar .sum{margin-left:0;width:100%;white-space:normal;font-size:11px;line-height:1.5}
  /* แถบค้นหา/ตัวกรอง — จัดเป็นตารางสองช่อง ไม่ให้ยืดเต็มบรรทัดละอัน */
  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .toolbar > input.inp{grid-column:1 / -1;min-width:0 !important}
  .toolbar > *{width:100%;min-width:0}
  .toolbar .inp,.toolbar select.inp{height:38px;font-size:13px}
  .toolbar .btn{height:38px;padding:0 12px;font-size:13px}
  .fieldrow{grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
  .sheethead{padding:12px 14px}

  /* การ์ดตัวเลขสรุป — บนมือถือเรียงสองคอลัมน์ ไม่ใช่ใบละแถว
     จะเห็นตัวเลขสำคัญครบในจอเดียวโดยไม่ต้องเลื่อน */
  .kpigrid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px}
  .card{padding:14px;border-radius:12px}
  .grid{gap:12px}
  .kpi .n{font-size:23px}
  .kpi .lbl{font-size:11px}
  .kpi .sub{font-size:11px;line-height:1.45}
  .maplegend{left:8px;bottom:8px;padding:8px 10px;font-size:11px;line-height:1.7}
  .toast{bottom:84px}
  table.resp thead{display:none}
  table.resp tr{display:block;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px;padding:10px}
  table.resp td{display:flex;justify-content:space-between;gap:10px;border:0;padding:4px 2px}
  table.resp td::before{content:attr(data-l);color:var(--dim);font-size:12px}
}
</style>
</head>
<body>

<!-- ======= หน้ารอโหลด ======= -->
<div id="splash">
  <div class="splash-brand">
    <div class="brandmark">อล</div>
    <div>
      <div class="kanit" style="font-size:17px">งานตัดต้นไม้</div>
      <div class="sub">กฟส.อ่าวลึก</div>
    </div>
  </div>
  <div class="spin"></div>
  <div id="splashMsg" class="msg" style="font-family:'Kanit',sans-serif;font-size:15px">กำลังรอ…</div>
  <div class="tipbox"><div class="k">เกร็ดการใช้งาน</div><div class="v" id="splashTip">—</div></div>
</div>

<!-- ======= เข้าสู่ระบบ ======= -->
<div id="login" class="hide">
  <form class="loginbox" onsubmit="doLogin(event)">
    <div class="brand">
      <div class="brandmark">อล</div>
      <div>
        <div class="kanit" style="font-size:18px">งานตัดต้นไม้</div>
        <div class="sub">กฟส.อ่าวลึก · ศูนย์รวมงาน</div>
      </div>
    </div>
    <div class="field" style="margin-bottom:12px">
      <label for="uname">ชื่อผู้ใช้</label>
      <input class="inp" id="uname" type="text" style="width:100%" placeholder="ชื่อที่ใช้ในระบบ SLD" autocomplete="username" required>
    </div>

<script>
/* ============================================================

const API_URL = 'https://script.google.com/macros/s/AKfycbx3pSMOKIPC0ZKUWzx4tJk-m-cmK0ACxxrGhy7kbs2-D24Rs_pnlMp2Lp3CXi-lSrpq/exec';

/* ศูนย์รวมงาน กฟส.อ่าวลึก — ใช้ล็อกอินและตัวนับสถิติร่วมกัน */
const HUB_GAS  = 'https://script.google.com/macros/s/AKfycbzqsOqJJQlF4SS1UX_YM6hmhd3lUXCVocAJiK7l28Tzddms9SQ9Z7p-iYgrrgd2B2meWw/exec';
const HUB_USER = 'pea_aoluek_username';
const HUB_PASS = 'pea_aoluek_password';
const APP_CODE = 'tree';
const BUILD = '2026-10-11m';   // เลขรุ่นไฟล์ ใช้เช็กว่าเครื่องโหลดไฟล์ใหม่แล้วจริง

/* ============ สถานะในหน่วยความจำ ============ */
const S = { user:null, token:null, year:'2569', data:null, view:'dash', map:null, layers:null, sld:null,
            stamp:'', checking:false };
const LS = 'treeala';

/* ============ แคชในเครื่อง — ทำให้เปิดแอปเร็วขึ้น ============
   เปิดแอป วาดจอจากข้อมูลครั้งก่อนทันที แล้วค่อยถามเซิร์ฟเวอร์ว่าเลขรุ่น
   (stamp) เปลี่ยนไหม ถ้าไม่เปลี่ยนก็ไม่ต้องโหลดใหม่เลย                */
function lsGet(key){
  try{ const v = localStorage.getItem(LS+'_'+key); return v ? JSON.parse(v) : null; }
  catch(e){ return null; }
}
function lsSet(key, val){
  try{ localStorage.setItem(LS+'_'+key, JSON.stringify(val)); return true; }
  catch(e){ try{ lsPrune(); localStorage.setItem(LS+'_'+key, JSON.stringify(val)); return true; }
            catch(e2){ return false; } }
}
function lsDel(key){ try{ localStorage.removeItem(LS+'_'+key); }catch(e){} }
/* พื้นที่เก็บเต็ม — ทิ้งแคชเก่าของแอปนี้ทั้งหมด แต่เก็บการล็อกอินและคิวส่งไว้ */
function lsPrune(){
  try{
    const keep = [LS+'_auth', LS+'_queue', HUB_USER, HUB_PASS];
    for(let i = localStorage.length - 1; i >= 0; i--){
      const k = localStorage.key(i);
      if(k && k.indexOf(LS+'_') === 0 && keep.indexOf(k) < 0) localStorage.removeItem(k);
    }
  }catch(e){}
}

/* ป้ายบอกความสดของข้อมูลบนแถบหัว */
function setFresh(text, tone){
  const e = $('#freshness');
  if(!e) return;
  if(!text){ e.textContent = ''; return; }
  const col = tone === 'warn' ? '#F2C85A' : (tone === 'live' ? '#9FE0BC' : '#D6C6E4');
  e.innerHTML = ' · <span style="color:'+col+'">'+esc(text)+'</span>';
}
function hhmm(){
  const d = new Date();
  return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}

/* ปุ่มโหลดข้อมูลใหม่ทั้งหมด — ล้างแคชทุกชั้นแล้วดึงสด */
async function reloadAll(){
  lsPrune();
  S.sld = null; S.sldFeeders = null; S.mv = undefined; S.lv = undefined;
  S.backbone = null; S.segNear = null;
  splash('กำลังโหลดข้อมูลใหม่ทั้งหมด…');
  await loadYear(S.year, {fresh:true});
  splashOff();
  setFresh('อัปเดตแล้ว ' + hhmm(), 'live');
  toast('โหลดข้อมูลใหม่จากชีตเรียบร้อย');
}

/* ============ เครื่องมือ ============ */
const $ = s => document.querySelector(s);
const el = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstElementChild; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { const n=parseFloat(String(v).replace(/,/g,'')); return isFinite(n)?n:0; };
const fmt = (v,d=2) => num(v).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt0 = v => num(v).toLocaleString('th-TH',{maximumFractionDigits:0});

function toast(msg, ms=2400){
  const t = el(`<div class="toast">${esc(msg)}</div>`);
  $('#toast').appendChild(t);
  setTimeout(()=>t.remove(), ms);
}

const TIPS = [
  'กดที่แถวใบงานในแท็บใบงาน เพื่อเปิดรายละเอียด รอบตรวจรับ และงวดเงินของใบนั้น',
  'ในหน้ารายละเอียด แก้วันตรวจรับแล้วกดบันทึกรอบนี้ ข้อมูลจะเข้าชีต TreeALA_DB ทันที',
  'แท็บแผนที่ระบายสีตามสถานะรอบล่าสุด เขียวคือตรวจรับครบ เหลืองคือรอตรวจรับ เทาคือยังไม่เริ่ม',
  'ปุ่มส่งออก CSV ในแท็บใบงาน ใช้ทำรายงานส่ง กฟต.2 ได้เลย เปิดด้วย Excel ได้ทันที',
  'สลับปี 2569 กับ 2570 ได้ที่มุมขวาบน ข้อมูลคนละชุดกัน',
  'หน้างานไม่มีสัญญาณก็บันทึกจุดที่พบได้ ระบบจะเก็บไว้แล้วส่งให้เองเมื่อเน็ตกลับมา',
  'ใช้ชื่อผู้ใช้และรหัสผ่านเดียวกับระบบ SLD เข้าแอปไหนก่อนก็ได้ ไม่ต้องล็อกอินซ้ำ',
  'กดที่เส้นบนแผนที่ จะบอกว่าเป็นช่วงจากอุปกรณ์ไหนถึงอุปกรณ์ไหน และฟีดเดอร์นั้นมีกี่ใบงาน',
  'ตัวเลขงวดเงินมาจากสัญญา 40/40/20 กดสลับสถานะได้ในแท็บงวดเงิน',
  'ไอคอนรูปบ้านมุมขวาบน กดกลับไปหน้าศูนย์รวมงานได้ทุกเมื่อ'
];
let tipTimer = null;
function startTips(el){
  if(!el) return;
  let i = Math.floor(Math.random()*TIPS.length);
  el.textContent = TIPS[i];
  clearInterval(tipTimer);
  tipTimer = setInterval(()=>{ i = (i+1) % TIPS.length; el.textContent = TIPS[i]; }, 4000);
}
function stopTips(){ clearInterval(tipTimer); tipTimer = null; }

/* ชั้นกำลังรอแบบวางทับกล่องใดก็ได้ */
function busy(container, msg){
  if(!container) return;
  let b = container.querySelector(':scope > .busy');
  if(!b){
    b = el(`<div class="busy">
      <div class="spin"></div>
      <div class="msg">กำลังรอ…</div>
      <div class="tipbox"><div class="k">เกร็ดการใช้งาน</div><div class="v"></div></div>
    </div>`);
    if(getComputedStyle(container).position === 'static') container.style.position = 'relative';
    container.appendChild(b);
  }
  b.querySelector('.msg').textContent = msg || 'กำลังรอ…';
  startTips(b.querySelector('.tipbox .v'));
}
function busyOff(container){
  if(!container) return;
  const b = container.querySelector(':scope > .busy');
  if(b) b.remove();
  stopTips();
}

function splash(msg){
  const el0 = $('#splash');
  if(!el0) return;
  el0.classList.remove('hide');
  $('#splashMsg').textContent = msg || 'กำลังรอ…';
  startTips($('#splashTip'));
}
function splashOff(){ const e = $('#splash'); if(e) e.classList.add('hide'); stopTips(); }
function showLogin(msg){
  splashOff();
  $('#login').classList.remove('hide');
  if(msg) $('#loginMsg').textContent = msg;
  const u = $('#uname');
  if(u && !u.value) u.focus();
}

async function api(action, payload={}){
  const body = Object.assign({action, user:S.user?S.user.name:'', token:S.token}, payload);
  const res = await fetch(API_URL, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  });
  const out = await res.json();
  if(!out.ok) throw new Error(out.error || 'เกิดข้อผิดพลาด');
  if(WRITE_ACTIONS.indexOf(action) >= 0) markDirty();
  return out;
}

/* หลังบันทึก ข้อมูลในชีตเปลี่ยนแล้ว — เก็บของในจอลงแคชไว้ให้เปิดเร็วเหมือนเดิม
   แต่ล้างเลขรุ่น เพื่อให้คราวหน้าดึงของจริงจากชีตมาทับให้แน่ใจ */
const WRITE_ACTIONS = ['saveRound','saveJob','savePayment','saveLine','saveLineFix','addFinding'];
let dirtyTimer = null;
function markDirty(){
  S.stamp = '';
  clearTimeout(dirtyTimer);
  dirtyTimer = setTimeout(()=>{
    if(!S.data) return;
    const copy = Object.assign({}, S.data); copy.stamp = '';
    lsSet('data_'+S.year, copy);
  }, 600);
}

/* ============ เชื่อมกับศูนย์รวมงาน ============ */
function hubCreds(){
  try{ return { name: localStorage.getItem(HUB_USER)||'', pass: localStorage.getItem(HUB_PASS)||'' }; }
  catch(e){ return { name:'', pass:'' }; }
}
function saveHubCreds(name, pass){
  try{ localStorage.setItem(HUB_USER, name); localStorage.setItem(HUB_PASS, pass); }catch(e){}
}

/* นับการเปิดใช้งานเข้าสถิติของศูนย์รวมงาน
   ถ้าเข้ามาจากการ์ดในหน้าศูนย์รวม หน้านั้นนับให้แล้ว จะไม่นับซ้ำ */
async function logAppOpen(){
  try{
    if(sessionStorage.getItem('tree_opened')) return;
    sessionStorage.setItem('tree_opened','1');
    const ref = document.referrer || '';
    if(ref){
      const u = new URL(ref);
      if(u.origin === location.origin && /^\/(index\.html)?$/.test(u.pathname)) return;
    }
    const c = hubCreds();
    if(!c.name) return;
    await fetch(HUB_GAS, {
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'appOpen', app:APP_CODE,
                             changedBy:c.name, changedByPassword:c.pass })
    });
  }catch(e){ /* สถิติไม่สำเร็จ ไม่กระทบการใช้งาน */ }
}

/* เข้าสู่ระบบอัตโนมัติด้วยบัญชีที่ล็อกอินไว้แล้วในศูนย์รวมงาน */
async function autoLogin(user, password){
  try{
    const res = await fetch(API_URL, {
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'login', user, password})
    });
    const out = await res.json();
    if(!out.ok){ showLogin(); return false; }
    S.user = out.user; S.token = out.token;
    localStorage.setItem(LS+'_auth', JSON.stringify({user:S.user, token:S.token}));
    await startApp();
    flushQueue(); logAppOpen();
    return true;
  }catch(e){ showLogin(); return false; }
}

/* ============ เข้าสู่ระบบ ============ */
async function doLogin(ev){
  ev.preventDefault();
  const user = $('#uname').value.trim();
  const password = $('#upass').value;
  $('#loginBtn').disabled = true; $('#loginMsg').textContent='';
  splash('กำลังตรวจสอบสิทธิ์…');
  try{
    const res = await fetch(API_URL, {
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'login', user, password})
    });
    const out = await res.json();
    if(!out.ok) throw new Error(out.error);
    S.user = out.user; S.token = out.token;
    localStorage.setItem(LS+'_auth', JSON.stringify({user:S.user, token:S.token}));
    saveHubCreds(user, password);
    await startApp();
    logAppOpen();
  }catch(e){
    splashOff();
    $('#login').classList.remove('hide');
    $('#loginMsg').textContent = e.message;
  }finally{
    $('#loginBtn').disabled = false;
  }
}

function logout(){
  localStorage.removeItem(LS+'_auth');
  try{ sessionStorage.setItem('tree_skipauto','1'); }catch(e){}
  location.reload();
}

/* ============ เริ่มต้นแอป ============ */
async function startApp(){
  $('#login').classList.add('hide');
  /* มีข้อมูลเก่าในเครื่องแล้ว ไม่ต้องขึ้นหน้ารอให้เสียเวลา */
  const warm = lsGet('data_'+S.year);
  if(!(warm && warm.jobs && warm.jobs.length)) splash('กำลังโหลดข้อมูล…');
  if(S.user) $('#whoami').textContent = S.user.name || '';
  await loadYear(S.year);
  if(!S.data){
    splash('โหลดข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง');
    return;
  }
  $('#app').classList.remove('hide');
  splashOff();
  setTimeout(fitAll, 50);
  setTimeout(()=>{ fitAll(); diagBox(); }, 600);
}

async function loadYear(year, opts={}){
  S.year = year;
  const key = 'data_'+year;
  const cached = opts.fresh ? null : lsGet(key);

  /* มีของเก่าอยู่ และเป็นชุดที่รู้เลขรุ่นแน่ชัด — วาดจอทันที แล้วเช็กเลขรุ่นเบื้องหลัง
     ถ้าไม่มีเลขรุ่น (เพิ่งมีการบันทึก หรือเป็นแคชรุ่นเก่า) จะไม่ใช้ของเก่า
     เพราะอาจเก่ากว่าที่เราหรือคนอื่นเพิ่งแก้ไป — ยอมรอโหลดจริงดีกว่าเห็นข้อมูลเก่า */
  if(cached && cached.stamp && cached.jobs && cached.jobs.length){
    S.data = cached;
    S.stamp = cached.stamp || '';
    renderYearSwitch();
    render();
    refreshInBackground(year);
    return;
  }

  /* ไม่มีของเก่า — ต้องรอโหลดจริง */
  try{
    const out = await api('bootstrap', {year, fresh: opts.fresh ? 1 : ''});
    S.data = out;
    S.stamp = out.stamp || '';
    lsSet(key, out);
    setFresh('อัปเดตแล้ว ' + hhmm(), 'live');
  }catch(e){
    const c = lsGet(key);
    if(c && c.jobs){ S.data = c; S.stamp = c.stamp || ''; setFresh('ออฟไลน์ ใช้ข้อมูลที่เก็บไว้','warn');
                     toast('ออฟไลน์ — แสดงข้อมูลที่บันทึกไว้'); }
    else { toast(e.message); return; }
  }
  renderYearSwitch();
  render();
}

/* เช็กเลขรุ่นแบบไม่บังหน้าจอ — เท่าเดิมก็จบ ไม่เท่าจึงดึงข้อมูลใหม่มาวาดทับ */
async function refreshInBackground(year){
  if(S.checking) return;
  S.checking = true;
  setFresh('กำลังตรวจข้อมูลใหม่…');
  try{
    const v = await api('version');
    if(String(v.stamp) === String(S.stamp)){
      setFresh('ข้อมูลล่าสุด', 'live');
      return;
    }
    const out = await api('bootstrap', {year, have: S.stamp});
    if(out.same){ setFresh('ข้อมูลล่าสุด','live'); return; }
    if(year !== S.year) return;              // ผู้ใช้สลับปีไปแล้ว ไม่ต้องวาดทับ
    S.data = out;
    S.stamp = out.stamp || '';
    lsSet('data_'+year, out);
    /* ข้อมูลเปลี่ยน — ผลคำนวณแผนที่ที่ผูกกับรุ่นเดิมใช้ไม่ได้แล้ว */
    S.backbone = null;
    renderYearSwitch();
    render();
    setFresh('อัปเดตแล้ว ' + hhmm(), 'live');
    toast('มีข้อมูลใหม่ อัปเดตหน้าจอให้แล้ว');
  }catch(e){
    setFresh('ออฟไลน์ ใช้ข้อมูลที่เก็บไว้', 'warn');
  }finally{
    S.checking = false;
  }
}

/* ============ การคำนวณสรุป ============ */
function summarize(){
  const d = S.data;
  const jobs = d.jobs;
  const annual = jobs.filter(j => j.JobType === 'รายปี');
  const lv = jobs.filter(j => j.System === 'LV');
  const byJob = {};
  d.rounds.forEach(r => { (byJob[r.JobID] = byJob[r.JobID] || []).push(r); });

  const roundStat = [1,2,3].map(no => {
    let done=0, wait=0, none=0;
    annual.forEach(j => {
      const r = (byJob[j.JobID]||[]).find(x => num(x.RoundNo) === no);
      const st = r ? String(r.Status) : '';
      if(st.indexOf('ตรวจรับแล้ว')>=0) done++;
      else if(st.indexOf('รอตรวจรับ')>=0 || st.indexOf('จ่ายงาน')>=0) wait++;
      else none++;
    });
    return {no, done, wait, none, total:annual.length};
  });

  const byFeeder = {};
  jobs.forEach(j => {
    const f = j.FeederID || 'ไม่ระบุ';
    byFeeder[f] = byFeeder[f] || {km:0, n:0};
    byFeeder[f].km += num(j.PlanKm);
    byFeeder[f].n++;
  });

  const byGroup = {};
  annual.forEach(j => {
    const g = j.MonthGroup || '-';
    byGroup[g] = byGroup[g] || {n:0, months:j.PlanMonths || ''};
    byGroup[g].n++;
  });

  return {
    jobs, annual, lv, byJob, roundStat, byFeeder, byGroup,
    totalKm: jobs.reduce((s,j)=>s+num(j.PlanKm),0),
    kmAnnual: annual.reduce((s,j)=>s+num(j.PlanKm),0),
    kmLv: lv.reduce((s,j)=>s+num(j.PlanKm),0),
    est: annual.reduce((s,j)=>s+num(j.EstPrice),0),
    estVat: annual.reduce((s,j)=>s+num(j.EstPriceVat),0),
    contract: jobs.reduce((s,j)=>s+num(j.ContractPrice),0)
  };
}

function jobRoundState(jobId, sum){
  const rs = (sum.byJob[jobId]||[]).slice().sort((a,b)=>num(a.RoundNo)-num(b.RoundNo));
  return rs;
}

function statusPill(st){
  const s = String(st||'');
  if(s.indexOf('ตรวจรับแล้ว')>=0) return '<span class="pill p-ok">ตรวจรับแล้ว</span>';
  if(s.indexOf('รอตรวจรับ')>=0 || s.indexOf('จ่ายงาน')>=0) return '<span class="pill p-warn">รอตรวจรับ</span>';
  if(s.indexOf('เกิน')>=0) return '<span class="pill p-bad">เกินกำหนด</span>';
  return '<span class="pill p-gray">ยังไม่จ่ายงาน</span>';
}
function sysPill(sys){
  if(sys==='HV') return '<span class="pill p-hv">HV</span>';

}

/* ============================================================
   การ์ด "ขั้นตอนงานหนึ่งรอบ" — คิดจากข้อมูลจริงในชีตทั้งหมด
   เตรียมงาน (ทำครั้งเดียวต่อปี): ข้องาน MJM/MFO -> ใบสั่ง ZPM4
   ทำทุกรอบ (ปีละ 3 รอบ): จ่ายงาน -> ตัด -> ตรวจรับ -> SAP Time -> เบิกงวด
   ============================================================ */
function curRound(s){
  for(let i = 0; i < s.roundStat.length; i++){
    const r = s.roundStat[i];
    if(r.done < r.total) return r.no;
  }
  return s.roundStat.length || 3;
}

function stepStats(s){
  const cur = curRound(s);
  const jobs = s.annual;
  const total = jobs.length;
  const roundOf = j => (s.byJob[j.JobID]||[]).find(x => num(x.RoundNo) === cur) || {};
  const has = v => String(v||'').trim() !== '';

  /* ตัด: นับเป็นใบงาน ใบไหนไลน์แยกลงวันที่ครบถือว่าตัดครบ
     ใบที่ยังไม่มีรายการไลน์แยก ใช้สถานะรอบแทน */
  const lineByJob = {};
  (S.data.lines||[]).forEach(l => { (lineByJob[l.JobID] = lineByJob[l.JobID] || []).push(l); });
  const cutDone = jobs.filter(j => {
    const ls = lineByJob[j.JobID];
    if(ls && ls.length) return ls.every(l => has(l['R'+cur+'Date']));
    const st = String(roundOf(j).Status||'');
    return st.indexOf('ตรวจรับแล้ว')>=0 || st.indexOf('รอตรวจรับ')>=0;
  }).length;

  const payDone = jobs.filter(j =>
    (S.data.payments||[]).some(p => p.JobID === j.JobID && num(p.Installment) === cur &&
                                    String(p.Status||'').indexOf('เบิกจ่ายแล้ว')>=0)).length;

  return { cur, total, steps: [
    {k:'mjm',  n:'ข้องาน',    m:'MJM/MFO', grp:0, v: jobs.filter(j => has(j.MJMNo)).length,
     miss:'ยังไม่มีเลขข้องาน MJM/MFO', go:'jobs'},
    {k:'zpm',  n:'ใบสั่ง',    m:'ZPM4',    grp:0, v: jobs.filter(j => has(j.ZPM4No)).length,
     miss:'ยังไม่มีเลขใบสั่ง ZPM4', go:'jobs'},
    {k:'assign',n:'จ่ายงาน',  m:'',        grp:1, v: jobs.filter(j => has(roundOf(j).AssignDate)).length,
     miss:'ยังไม่จ่ายงาน', go:'jobs'},
    {k:'cut',  n:'ตัด',       m:'',        grp:1, v: cutDone,
     miss:'ยังตัดไม่ครบ', go:'map'},
    {k:'acc',  n:'ตรวจรับ',   m:'',        grp:1, v: jobs.filter(j => has(roundOf(j).AcceptDate)).length,
     miss:'ยังไม่ตรวจรับ', go:'jobs'},
    {k:'sap',  n:'SAP Time',  m:'',        grp:1, v: jobs.filter(j => has(roundOf(j).SAPTimeDate)).length,
     miss:'ยังไม่คีย์ SAP Time', go:'jobs'},
    {k:'pay',  n:'เบิกงวด',   m:'',        grp:1, v: payDone,
     miss:'ยังไม่เบิกงวด', go:'pay'}
  ]};
}

function stepRow(list, total, nowKey){
  return list.map((st, i) => {
    const done = st.v >= total && total > 0;
    const cls = done ? 'done' : (st.k === nowKey ? 'now' : '');
    const mark = done ? '&#10003;' : (list.slice(0,i).every(x=>x.v>=total) ? String(i+1) : String(i+1));
    return `<div class="stp ${cls}">${i < list.length-1 ? '<div class="bar"></div>' : ''}
      <div class="dot">${mark}</div>
      <div class="n">${esc(st.n)}</div>
      <div class="m">${st.m ? esc(st.m) : st.v + '/' + total}</div>
    </div>`;
  }).join('');
}

function stepCard(s){
  if(!s.annual.length) return '';
  const S2 = stepStats(s);
  const now = S2.steps.find(x => x.v < S2.total) || S2.steps[S2.steps.length-1];
  const left = S2.total - now.v;
  const g0 = S2.steps.filter(x => x.grp === 0);
  const g1 = S2.steps.filter(x => x.grp === 1);
  const nowLabel = now.v >= S2.total ? 'ครบทุกขั้นแล้ว' : now.n + (now.m ? ' ' + now.m : '');

  return `
  <div class="card" style="margin-top:12px">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <h3 style="font-size:16px">ขั้นตอนงานหนึ่งรอบ</h3>
      <span class="pill p-warn">รอบที่ ${S2.cur}/${esc(S.year)}</span>
    </div>
    <div class="sub" style="margin-top:3px">ตอนนี้อยู่ขั้น ${esc(nowLabel)}</div>

    <div class="stepgrp">เตรียมงาน · ทำครั้งเดียวต่อปี</div>
    <div class="steps">${stepRow(g0, S2.total, now.k)}</div>

    <div class="stepgrp">ทำทุกรอบ · ปีละ 3 รอบ</div>
    <div class="steps">${stepRow(g1, S2.total, now.k)}</div>

    ${now.v >= S2.total ? '' : `
    <div style="height:1px;background:var(--line2);margin:16px 0 13px"></div>
    <button type="button" class="nextrow" onclick="goView('${now.go}')">
      <div class="ic">!</div>
      <div><div class="t">ต้องทำต่อ: ${esc(now.miss)}</div>
        <div class="d">${left} ใบงาน จาก ${S2.total} · รอบที่ ${S2.cur}/${esc(S.year)}</div></div>
      <svg class="cv" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </button>`}
  </div>`;
}

function exportCsv(){
  const s = summarize();
  const cols = ['MJMNo','JobName','System','FeederID','PlanKm','MonthGroup','EstPrice','EstPriceVat','ContractPrice','Contractor','ZPM4No','Status'];
  const head = ['เลขใบงาน','ชื่องาน','ระบบ','ฟีดเดอร์','ระยะทาง','กลุ่ม','ประมาณการ','รวม VAT','ราคาจ้าง','ผู้รับจ้าง','ใบสั่ง ZPM4','สถานะ'];
  const lines = [head.join(',')].concat(s.jobs.map(j =>
    cols.map(c => `"${String(j[c]==null?'':j[c]).replace(/"/g,'""')}"`).join(',')));
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `งานตัดต้นไม้_${S.year}.csv`;
  a.click();
}

function shrinkImage(file, max=1280, q=0.72){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

function queueOffline(item){
  const q = JSON.parse(localStorage.getItem(LS+'_queue') || '[]');
  q.push(item); localStorage.setItem(LS+'_queue', JSON.stringify(q));
}

async function flushQueue(){
  const q = JSON.parse(localStorage.getItem(LS+'_queue') || '[]');
  if(!q.length || !S.token) return;
  const left = [];
  for(const it of q){
    try{ await api(it.action, it); }catch(e){ left.push(it); }
  }
  localStorage.setItem(LS+'_queue', JSON.stringify(left));
  if(q.length !== left.length) toast('ส่งข้อมูลที่ค้างไว้แล้ว ' + (q.length-left.length) + ' รายการ');
}

/* ใบงานเจ้าของไลน์เมนของแต่ละฟีดเดอร์
   สำคัญ: งานแรงสูง 115 kV (ALA03YB-101, ALA05YB-101) ใช้รหัสฟีดเดอร์เดียวกัน
   แต่เป็นสายส่งคนละเส้นกับระบบจำหน่าย 33 kV จึงต้องเอางาน MV กลุ่ม 1 ก่อนเสมอ
   แล้วค่อยใช้งานแรงสูงเป็นตัวสำรองเฉพาะฟีดเดอร์ที่ไม่มีงาน MV กลุ่ม 1 */
function mainJobByFeeder(sum){
  const mv = {}, hv = {};
  sum.jobs.forEach(j => {
    const f = String(j.FeederID||'').toUpperCase();
    if(!f) return;
    if(j.System === 'HV'){ if(!hv[f]) hv[f] = j.JobID; return; }
    if(j.System === 'LV') return;
    if(String(j.MonthGroup) === '1' && !mv[f]) mv[f] = j.JobID;
  });
  Object.keys(hv).forEach(f => { if(!mv[f]) mv[f] = hv[f]; });
  return mv;
}

/* ใบงานที่เป็นเจ้าของอุปกรณ์แต่ละตัว — ไล่จากไลน์แยกขึ้นไปหาต้นทาง */
function buildOwnerIndex(sum, byId){
  const byCode = {};
  (S.data.lines || []).forEach(l => {
    const c = String(l.LineCode||'').replace(/\s+/g,'').toUpperCase();
    if(c) byCode[c] = l.JobID;
  });
  const mainByFeeder = mainJobByFeeder(sum);
  const cache = {};
  const detail = mapFilter.detail === 'line';
  return function ownerOf(p){
    if(cache[p.id] !== undefined) return cache[p.id];
    let found = '';
    if(detail){
      let cur = p, guard = 0;
      while(cur && guard++ < 60){
        const key = String(cur.id||'').replace(/\s+/g,'').toUpperCase();
        if(byCode[key]){ found = byCode[key]; break; }
        cur = cur.parent ? byId[cur.parent] : null;
      }
    }
    if(!found) found = mainByFeeder[(p.feeder||'').toUpperCase()] || '';
    cache[p.id] = found;
    return found;
  };
}

function jobPasses(j){
  if(!j) return false;
  if(mapFilter.con && String(j.Contractor||'').trim() !== mapFilter.con) return false;

  if(mapFilter.sys && j.System !== mapFilter.sys) return false;
  if(mapFilter.month){

    if(m.indexOf(mapFilter.month) < 0) return false;
  }
  return true;
}

/* แนวสายจริงจาก GIS — ไฟล์เดียวกับที่ระบบ SLD ใช้ */
async function loadGeoFile(url){
  try{
    const res = await fetch(url, {cache:'force-cache'});
    if(!res.ok) return null;
    const j = await res.json();
    const src = j.lines || j;
    const out = {};
    Object.keys(src).forEach(f => {
      const arr = Array.isArray(src[f]) ? src[f] : [];
      out[String(f).toUpperCase()] = arr.map(seg => {
        const v = Array.isArray(seg) ? seg : (seg.v || seg.coords || []);
        return {
          main: seg && seg.m ? 1 : 0,
          v: v.map(c => Array.isArray(c) ? { lat: +c[0], lon: +c[1] } : { lat: +c.lat, lon: +c.lon })
              .filter(c => isFinite(c.lat) && isFinite(c.lon))
        };
      }).filter(x => x.v.length > 1);
    });
    return Object.keys(out).length ? out : null;
  }catch(e){ return null; }
}

/* หาอุปกรณ์ที่ใกล้จุดนี้ที่สุด ภายในฟีดเดอร์เดียวกัน */
function nearestDevice(lat, lon, list){
  let best = null, bd = Infinity;
  for(let i = 0; i < list.length; i++){
    const p = list[i];
    const dy = (p.lat - lat), dx = (p.lng - lon) * 0.99;
    const d = dy*dy + dx*dx;
    if(d < bd){ bd = d; best = p; }
  }
  return bd < 0.0000025 ? best : null;   // ราว 170 เมตร กันจับคู่ข้ามไลน์
}

/* ---- หาแนวไลน์เมนอัตโนมัติจากโครงข่าย GIS + ตำแหน่งอุปกรณ์ต้นทาง ---- */
const BACKBONE_TYPES = ['WB','WS','WR','YB'];

function segKeyOf(feeder, i){ return feeder + '#' + i; }

/* ============ แคชผลคำนวณแผนที่ ============
   ไลน์เมนและอุปกรณ์ที่ใกล้แต่ละช่วงสาย เป็นการคำนวณจากพิกัดล้วน ๆ
   เดิมคำนวณใหม่ทุกครั้งที่เปิดแผนที่ (หนักสุดในแอป) จึงเก็บผลไว้ในเครื่อง
   และล้างเองเมื่อจำนวนจุดอุปกรณ์หรือจำนวนช่วงสายเปลี่ยน              */
function segGeoVersion(){
  let n = 0;
  if(S.mv) Object.keys(S.mv).forEach(f => { n += S.mv[f].length; });
  return 'v2|' + (S.sld ? S.sld.length : 0) + '|' + n;   // ขึ้นเลขรุ่นเมื่อสูตรเปลี่ยน
}
function loadSegGeo(){
  const v = segGeoVersion();
  if(S.segGeo && S.segGeo.v === v) return S.segGeo;
  const c = lsGet('seggeo');
  if(c && c.v === v){ S.segGeo = {v:v, bb:c.bb||{}, near:c.near||{}, nearMain:c.nearMain||{}, dirty:false}; }
  else { S.segGeo = {v:v, bb:{}, near:{}, nearMain:{}, dirty:true}; S.backbone = null; }
  return S.segGeo;
}
function saveSegGeo(){
  if(!S.segGeo || !S.segGeo.dirty) return;
  if(lsSet('seggeo', {v:S.segGeo.v, bb:S.segGeo.bb, near:S.segGeo.near, nearMain:S.segGeo.nearMain}))
    S.segGeo.dirty = false;
}

function nodeKey(c){ return c.lat.toFixed(5) + ',' + c.lon.toFixed(5); }

function buildBackboneSet(feeder, segs, devs){
  /* กราฟจากจุดหักของแนวสายจริง */
  const adj = {};
  const nodes = [];
  const push = (a, b, si) => { (adj[a] = adj[a] || []).push({ to: b, si }); };
  segs.forEach((item, si) => {
    const v = item.v;
    for(let i = 0; i < v.length - 1; i++){
      const a = nodeKey(v[i]), b = nodeKey(v[i+1]);
      push(a, b, si); push(b, a, si);
    }
    v.forEach(c => nodes.push({ k: nodeKey(c), lat: c.lat, lon: c.lon }));
  });
  if(!nodes.length) return new Set();

  const snap = (lat, lng) => {
    let best = null, bd = Infinity;
    for(let i = 0; i < nodes.length; i++){
      const dy = nodes[i].lat - lat, dx = (nodes[i].lon - lng) * 0.99;
      const d = dy*dy + dx*dx;
      if(d < bd){ bd = d; best = nodes[i]; }
    }
    return (best && bd < 0.0000081) ? best.k : null;   // ราว 300 เมตร
  };

  const back = devs.filter(d => BACKBONE_TYPES.indexOf(String(d.type||'').toUpperCase()) >= 0);
  if(back.length < 2) return new Set();

  /* ต้นทาง: อุปกรณ์ชนิด WB ถ้าไม่มีก็ตัวที่ไม่มีต้นทาง ถ้าไม่มีอีกก็ตัวแรก */
  let root = back.find(d => String(d.type).toUpperCase() === 'WB')
          || back.find(d => !d.parent)
          || back[0];
  const rootKey = snap(root.lat, root.lng);
  if(!rootKey) return new Set();

  /* เดินกว้างจากต้นทาง เก็บเส้นทางย้อนกลับ */
  const prev = { [rootKey]: null };
  const queue = [rootKey];
  for(let qi = 0; qi < queue.length; qi++){
    const cur = queue[qi];
    (adj[cur] || []).forEach(e => {
      if(prev[e.to] !== undefined) return;
      prev[e.to] = { from: cur, si: e.si };
      queue.push(e.to);
    });
  }

  /* เส้นทางจากต้นทางไปยังอุปกรณ์ไลน์เมนทุกตัว = แนวไลน์เมน */
  const mark = new Set();
  back.forEach(d => {
    const k = snap(d.lat, d.lng);
    if(!k || prev[k] === undefined) return;
    let cur = k, guard = 0;
    while(prev[cur] && guard++ < 20000){
      mark.add(prev[cur].si);
      cur = prev[cur].from;
    }
  });
  return mark;
}

    const c = lsGet('sld');
    if(c && c.points && c.points.length){ S.sld = c.points; S.sldFeeders = c.feeders || []; }
  }

  if(!S.sld){

      const out = await api('sldPoints');

  }

  const sum = summarize();

  const pts = S.sld || [];
  const byId = {};
  pts.forEach(p => { if(p.id) byId[p.id] = p; });
  const jobById = {};
  sum.jobs.forEach(j => { jobById[j.JobID] = j; });
  const ownerOf = buildOwnerIndex(sum, byId);

  const colorFor = (job, ok) => {
    if(!ok) return DIM;
    if(!job) return '#9A958C';
    if(mapFilter.mode === 'contractor') return contractorColor(job.Contractor);
    if(mapFilter.mode === 'group') return GROUP_COLORS[String(job.MonthGroup)] || '#9A958C';

  if(mapFilter.geo === 'real' && S.mv === undefined){

  }

  let drawn = 0;
  let minLon=180, maxLon=-180, minLat=90, maxLat=-90;
  const seen = (lon,lat)=>{ minLon=Math.min(minLon,lon); maxLon=Math.max(maxLon,lon);
                            minLat=Math.min(minLat,lat); maxLat=Math.max(maxLat,lat); };

  const byFeederPts = {};
  pts.forEach(p => {
    const f = (p.feeder||'').toUpperCase();
    (byFeederPts[f] = byFeederPts[f] || []).push(p);
  });

  const feederMain = mainJobByFeeder(sum);

  /* อุปกรณ์ไลน์เมนเท่านั้น (WB/WS/WR/YB) ใช้หาเจ้าของของช่วงสายที่เป็นไลน์เมน
     กันไม่ให้สีของไลน์แยกข้าง ๆ เลอะขึ้นมาบนไลน์เมน */
  const mainPtsByFeeder = {};
  pts.forEach(p => {
    if(BACKBONE_TYPES.indexOf(String(p.type||'').toUpperCase()) < 0) return;
    const f = (p.feeder||'').toUpperCase();
    (mainPtsByFeeder[f] = mainPtsByFeeder[f] || []).push(p);
  });

  const useReal = mapFilter.geo === 'real' && S.mv && Object.keys(S.mv).length > 0;

  if(useReal){
    /* วาดตามแนวสายจริงจาก GIS ชุดเดียวกับระบบ SLD */
    const fixBySeg = {};
    (S.data.linefix || []).forEach(x => { fixBySeg[String(x.SegKey)] = String(x.JobID); });

    /* ผลคำนวณทางเรขาคณิต (ไลน์เมน และอุปกรณ์ที่ใกล้แต่ละช่วงสาย)
       ไม่ขึ้นกับตัวกรองหรือปีเลย คำนวณครั้งเดียวแล้วเก็บไว้ในเครื่อง   */
    loadSegGeo();

    Object.keys(S.mv).forEach(f => {
      const list = byFeederPts[f] || [];
      if(!S.backbone) S.backbone = {};
      if(!S.backbone[f]){
        const saved = S.segGeo.bb[f];
        S.backbone[f] = saved ? new Set(saved) : buildBackboneSet(f, S.mv[f], list);
        if(!saved){ S.segGeo.bb[f] = Array.from(S.backbone[f]); S.segGeo.dirty = true; }
      }
      const bb = S.backbone[f];
      if(!S.segGeo.near[f]) S.segGeo.near[f] = {};
      if(!S.segGeo.nearMain[f]) S.segGeo.nearMain[f] = {};
      const nearOf = S.segGeo.near[f];
      const nearMainOf = S.segGeo.nearMain[f];
      const mains = mainPtsByFeeder[f] || [];

      /* หาอุปกรณ์ที่ใกล้ช่วงสายนี้ที่สุด แล้วจำผลไว้ (เป็นเรขาคณิตล้วน ไม่ขึ้นกับปีหรือตัวกรอง) */
      const nearIdOf = (cache, pool, seg, si) => {
        let nid = cache[si];
        if(nid === undefined){
          const mid = seg[Math.floor(seg.length / 2)];
          const near = pool.length ? nearestDevice(mid.lat, mid.lon, pool) : null;
          nid = near && near.id ? near.id : '';
          cache[si] = nid; S.segGeo.dirty = true;
        }
        return nid ? (byId[nid] || null) : null;
      };

      S.mv[f].forEach((item, si) => {
        const seg = item.v;
        const key = segKeyOf(f, si);
        const isMain = bb.has(si);

        let jid = fixBySeg[key] || '';
        let how = jid ? 'กำหนดเอง' : '';
        /* ช่วงที่เป็นไลน์เมน ให้ดูรหัสไลน์เมนที่อยู่ใกล้ก่อน (เช่น ALA03WR-101 บ้านสหกรณ์)
           ถ้าหารหัสไม่ได้จึงใช้ใบงานไลน์เมนประจำฟีดเดอร์ */
        if(!jid && isMain){
          const nm = nearIdOf(nearMainOf, mains, seg, si);
          jid = nm ? ownerOf(nm) : '';
          how = jid ? 'ไลน์เมน · ตามรหัส' : '';
          if(!jid){ jid = feederMain[f] || ''; how = 'ไลน์เมน · ตามฟีดเดอร์'; }
        }
        if(!jid){
          const near = nearIdOf(nearOf, list, seg, si);
          jid = near ? ownerOf(near) : '';
          how = jid ? 'ไลน์แยก' : '';
        }
        if(!jid){ jid = feederMain[f] || ''; how = how || 'ฟีดเดอร์'; }

        const job = jobById[jid];
        const ok = jobPasses(job);
        const color = colorFor(job, ok);
        if(ok) seg.forEach(c => seen(c.lon, c.lat));
        try{
          map.Overlays.add(new longdo.Polyline(
            seg.map(c => ({ lon: c.lon, lat: c.lat })),
            { title: job ? `${esc(job.MJMNo)} · ${esc(f)}` : esc(f),
              detail: (job
                ? `${esc(job.JobName||'')}<br>ผู้รับจ้าง: ${esc(job.Contractor)||'ยังไม่ระบุ'}<br>แผนเดือน: ${esc(job.PlanMonths)||'-'}`
                : 'แนวสาย ' + esc(f)) +
                `<br><span style="color:#75716A">ที่มาของสี: ${esc(how)}</span>` +
                `<br><a href="#" onclick="fixSeg('${esc(key)}','${esc(f)}');return false;">แก้ผู้รับผิดชอบเส้นนี้</a>`,
              lineWidth: ok ? (isMain ? 5 : 3) : 1.5, lineColor: color, clickable: true }
          ));
          drawn++;
        }catch(e){}
      });
    });
    saveSegGeo();

    /* แรงต่ำ — ใช้ใบงาน LV ของฟีดเดอร์นั้นเป็นเจ้าของ */
    if(S.lv){
      const lvJob = {};
      sum.jobs.forEach(j => {
        if(j.System !== 'LV') return;
        const f = String(j.FeederID||'').toUpperCase();
        if(f && !lvJob[f]) lvJob[f] = j;
      });
      Object.keys(S.lv).forEach(f => {
        const job = lvJob[f] || null;
        const ok = jobPasses(job);
        const color = colorFor(job, ok);
        S.lv[f].forEach(item => {
          if(ok) item.v.forEach(c => seen(c.lon, c.lat));
          try{
            map.Overlays.add(new longdo.Polyline(
              item.v.map(c => ({ lon: c.lon, lat: c.lat })),
              { title: job ? `${esc(job.MJMNo)} · แรงต่ำ ${esc(f)}` : ('แรงต่ำ ' + esc(f)),
                detail: job
                  ? `${esc(job.JobName||'')}<br>ผู้รับจ้าง: ${esc(job.Contractor)||'ยังไม่ระบุ'}<br>แผนเดือน: ${esc(job.PlanMonths)||'-'}`
                  : 'แนวสายแรงต่ำ ' + esc(f),
                lineWidth: ok ? 2 : 1, lineColor: color, clickable: true }
            ));
            drawn++;
          }catch(e){}
        });
      });
    }
  }else{
    /* เส้นตรงระหว่างอุปกรณ์ตาม ParentID */
    pts.forEach(p => {
      const job = jobById[ownerOf(p)];
      const ok = jobPasses(job);
      const color = colorFor(job, ok);
      const f = (p.feeder||'').toUpperCase();
      if(ok) seen(p.lng, p.lat);
      const par = p.parent && byId[p.parent];
      if(!par) return;
      try{
        map.Overlays.add(new longdo.Polyline(
          [{ lon: par.lng, lat: par.lat }, { lon: p.lng, lat: p.lat }],
          { title: job ? `${esc(job.MJMNo)} · ${esc(f)}` : (f || 'ช่วงสาย'),
            detail: `${esc(par.id)} &rarr; ${esc(p.id)}` +
                    (job ? `<br>${esc(job.JobName||'')}<br>ผู้รับจ้าง: ${esc(job.Contractor)||'ยังไม่ระบุ'}` : ''),
            lineWidth: ok ? 4 : 2, lineColor: color, clickable: true }
        ));
        drawn++;
      }catch(e){}
    });
  }

  /* หมุดอุปกรณ์หลัก */
  pts.forEach(p => {
    if(p.type !== 'WS' && p.type !== 'WR' && p.type !== 'WB') return;
    const job = jobById[ownerOf(p)];
    const ok = jobPasses(job);
    const color = colorFor(job, ok);
    const f = (p.feeder||'').toUpperCase();
    if(!useReal || ok) seen(p.lng, p.lat);
    try{
      map.Overlays.add(new longdo.Marker({ lon: p.lng, lat: p.lat }, {
        title: p.id,
        detail: `${esc(p.desc||'')}<br>${esc(f)} · ${esc(p.type||'')}` +
                (job ? `<br>${esc(job.MJMNo)} · ${esc(job.Contractor)||'ยังไม่ระบุ'}` : ''),
        icon: { html: `<div style="width:11px;height:11px;border-radius:99px;background:${color};border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.28)"></div>`,
                offset: { x: 5, y: 5 } }
      }));
    }catch(e){}
  });

  S.data.findings.forEach(f => {
    const lat = num(f.Lat), lng = num(f.Lng);
    if(!lat || !lng) return;
    seen(lng, lat);
    try{
      map.Overlays.add(new longdo.Marker({ lon: lng, lat: lat }, {
        title: f.DeviceID || 'จุดที่พบ',
        detail: `${esc(f.TreeType||'')}<br>${esc(f.Severity||'')} · ${esc(f.Status||'')}`,
        icon: { html: `<div style="width:14px;height:14px;border-radius:99px;background:#fff;border:3px solid #B4402E"></div>`,
                offset: { x: 7, y: 7 } }
      }));
    }catch(e){}
  });

  if(minLon <= maxLon && minLat <= maxLat){
    try{ map.bound({ minLon, minLat, maxLon, maxLat }); }catch(e){}
  }

  const hint = document.getElementById('mapHint');
  if(!drawn && !hint){
    $('#v-map').appendChild(el(`<div id="mapHint" class="card" style="position:absolute;right:12px;top:66px;z-index:20;max-width:280px">
      <div style="font-weight:600;margin-bottom:6px">ยังไม่มีพิกัดจากระบบ SLD</div>
      <div class="sub">ตรวจค่า SLD_SHEET_ID ในแท็บ Config ของชีต TreeALA_DB แล้วรีเฟรชหน้านี้</div></div>`));
  }else if(drawn && hint){
    hint.remove();
  }
}

/* ============ วัดความสูงจอจริง ============
   บนมือถือ 100vh นับรวมพื้นที่ใต้แถบ URL และบางเครื่อง 100dvh ก็ยังไม่ตรง
   จึงวัดจาก visualViewport ซึ่งคือ "พื้นที่ที่ตามองเห็นจริง" แล้วส่งเข้า CSS
   ผ่านตัวแปร --vh ทำให้โครงแอปสูงพอดีจอทุกเครื่อง ไม่เหลือแถบว่างด้านล่าง */
/* วัดจากเครื่องจริงแล้วพบว่า บนไอโฟนที่เพิ่มลงหน้าจอโฮม
   visualViewport.height จะหักพื้นที่แถบสถานะด้านบน (47 px) ออกไปด้วย
   ทั้งที่หน้าเว็บวาดตั้งแต่ขอบบนจริง ๆ จึงเหลือที่ว่างด้านล่าง 47 px พอดี
   ส่วน innerHeight ให้ค่าเต็มจอ 844 ถูกต้อง — จึงใช้ innerHeight เป็นหลัก */
function safeInset(side){
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:-999px;top:0;width:1px;height:env(safe-area-inset-'+side+',0px)';
  document.body.appendChild(d);
  const h = d.getBoundingClientRect().height;
  d.remove();
  return Math.round(h);
}

function isStandalone(){
  return (window.navigator.standalone === true) ||
         (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
}

/* วัดจากเครื่องจริง (iPhone 390x844 เพิ่มลงหน้าจอโฮม) ได้ว่า
     innerHeight = 797   visualViewport = 797   safe-area บน = 47   จอจริง = 844
   คือไอโฟนหักความสูงแถบสถานะ 47 ออกจากกรอบหน้าเว็บ แต่ยังวาดเนื้อหาตั้งแต่ขอบบนจริง
   กรอบจึงจบที่ 797 เหลือที่ว่างด้านล่าง 47 พอดี  ->  ต้องบวก 47 คืนเอง
   เปิดในเบราว์เซอร์ safe-area เป็น 0 สูตรเดียวกันจึงได้ค่าเดิมไม่กระทบ */
function shellHeight(){
  const vv = window.visualViewport;
  let base = window.innerHeight || 0;
  if(vv && vv.height > base) base = vv.height;
  return Math.round(base);
}
function fitShell(){
  const h = shellHeight();
  if(h > 240) document.documentElement.style.setProperty('--vh', h + 'px');
}

/* ตรวจซ้ำหลังวาดจอจริง เผื่อเครื่องรุ่นไหนรายงานไม่ตรงอีก */
function verifyShell(){
  const app = document.getElementById('app');
  if(!app || app.classList.contains('hide')) return;
  if(getComputedStyle(app).position !== 'fixed') return;     // จอคอมไม่ต้องยุ่ง
  const r = app.getBoundingClientRect();
  const want = shellHeight();
  if(want > 240 && Math.abs(r.bottom - want) > 1){
    document.documentElement.style.setProperty('--vh', Math.round(want - r.top) + 'px');
  }
}
/* ไอโฟนตอนเปิดจากหน้าจอโฮมวาดได้แค่ในกรอบ 797 ส่วนที่เหลือใต้กรอบอีก 47 px
   วาดอะไรลงไปไม่ได้เลย (ทดสอบแล้ว ตั้งกล่องสูง 844 สีก็ยังหยุดที่ 797)
   แต่ 47 px นั้นทำหน้าที่เป็นระยะปลอดภัยขอบล่างให้อยู่แล้ว มากกว่า 34 px ที่ต้องการ
   จึงตัดระยะขอบล่างของเมนูออก ไอคอนจะขยับลงไปชิดขอบกรอบ ไม่ลอยสูงเหมือนเดิม */
function fitNavPad(){
  const root = document.documentElement;
  if(isStandalone() && safeInset('top') > 0) root.style.setProperty('--navpad', '8px');
  else root.style.removeProperty('--navpad');
}
function fitAll(){ fitShell(); fitNavPad(); setTimeout(verifyShell, 60); }

fitShell();
addEventListener('resize', fitAll);
addEventListener('orientationchange', ()=>{ setTimeout(fitAll, 120); setTimeout(fitAll, 500); });
addEventListener('pageshow', fitAll);
addEventListener('load', ()=>setTimeout(fitAll, 150));
if(window.visualViewport) window.visualViewport.addEventListener('resize', fitShell);

/* เปิดโหมดตรวจเมื่อ URL มี ?diag=1 — ทาพื้นหลังหน้าเว็บเป็นสีแดง
   ถ้าแถบว่างด้านล่างกลายเป็นสีแดง แปลว่าแถบนั้นยังอยู่ในหน้าเว็บ
   ถ้ายังเป็นสีขาว/ครีม แปลว่าอยู่นอกหน้าเว็บ ไอโฟนกันพื้นที่ไว้เอง */
const DIAG = /[?&]diag=1/.test(location.search);
if(DIAG) document.documentElement.classList.add('diag');

function diagBox(){
  if(!DIAG) return;
  const e = document.getElementById('diagbox');
  if(!e) return;
  const vv = window.visualViewport;
  const app = document.getElementById('app');
  const ar = app ? app.getBoundingClientRect() : {height:0,bottom:0};
  const nav = document.getElementById('bnav');
  const nr = nav ? nav.getBoundingClientRect() : {bottom:0};
  const standalone = (window.navigator.standalone === true) ||
                     (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  e.innerHTML =
    '<b>รุ่น ' + BUILD + '</b><br>' +
    'จอเครื่อง ' + screen.width + ' × ' + screen.height + '<br>' +
    'innerHeight ' + window.innerHeight + '<br>' +
    'visualViewport ' + (vv ? Math.round(vv.height) : '-') + '<br>' +
    'ตั้งให้สูง ' + shellHeight() + '<br>' +
    'ความสูงโครงแอป ' + Math.round(ar.height) + '<br>' +
    'ขอบล่างเมนู ' + Math.round(nr.bottom) + '<br>' +
    'safe-area บน/ล่าง ' + safeInset('top') + ' / ' + safeInset('bottom') + '<br>' +
    'เปิดจาก ' + (standalone ? 'หน้าจอโฮม' : 'เบราว์เซอร์') +
    '<div class="note">แถบว่างข้างล่าง<br>• <b style="color:#FF8A80">แดง</b> = อยู่ในหน้าเว็บ แก้ที่ CSS ได้<br>' +
    '• <b style="color:#FFF59D">เหลือง</b> = เมนูยืดถึงแล้ว<br>• <b>ขาว/ครีม</b> = อยู่นอกหน้าเว็บ ไอโฟนกันไว้เอง</div>';
}
addEventListener('resize', ()=>setTimeout(diagBox, 80));
addEventListener('load', ()=>setTimeout(diagBox, 300));
setTimeout(diagBox, 600);
setTimeout(diagBox, 1800);

/* อ่านค่าจริงจากเครื่อง ไว้ดูว่าทำไมขอบล่างไม่เต็ม */
function screenDiag(){
  if(!DIAG) return;
  const e = document.getElementById('diag');
  if(!e) return;
  const vv = window.visualViewport;
  const app = document.getElementById('app').getBoundingClientRect();
  const nav = document.getElementById('bnav').getBoundingClientRect();
  const standalone = (window.navigator.standalone === true) ||
                     (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  e.textContent =
    'จอ ' + screen.width + '×' + screen.height +
    ' · inner ' + window.innerHeight +
    ' · vv ' + (vv ? Math.round(vv.height) : '-') +
    ' · โครง ' + Math.round(app.height) +
    ' · ล่างเมนู ' + Math.round(nav.bottom) +
    ' · inset ' + safeInset('top') + '/' + safeInset('bottom') +
    ' · ' + (standalone ? 'โฮม' : 'เบราว์เซอร์');
}
addEventListener('resize', ()=>setTimeout(screenDiag, 80));

/* กลับมาที่แท็บนี้เมื่อไร ให้เช็กว่ามีคนอื่นแก้ข้อมูลหรือยัง
   (ที่ กฟส.อ่าวลึก มีหลายคนแก้พร้อมกัน จึงต้องดึงของคนอื่นมาด้วย) */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && S.data) refreshInBackground(S.year);
});

/* ============ เริ่มทำงาน ============ */
(function init(){
  const a = localStorage.getItem(LS+'_auth');
  if(a){
    try{
      const o = JSON.parse(a);
      S.user = o.user; S.token = o.token;
      startApp().then(()=>{ flushQueue(); logAppOpen(); });
      return;
    }catch(e){ /* ข้อมูลเสีย ให้เข้าสู่ระบบใหม่ */ }
  }
  const c = hubCreds();
  if(c.name) $('#uname').value = c.name;
  let skip = false;
  try{ skip = !!sessionStorage.getItem('tree_skipauto'); }catch(e){}
  if(!skip && c.name && c.pass){
    splash('กำลังเข้าสู่ระบบด้วยบัญชีศูนย์รวมงาน…');
    autoLogin(c.name, c.pass);
  }else{
    showLogin();
  }
})();
</script>
