/* ============================================================
   ระบบจัดการพาโทรล — รายการ รายละเอียด และการสั่งงานต่อ
   ============================================================ */
let PL = { filter: 'waiting', rows: [], sum: null, busy: false, item: null, edit: null, near: {} };

const PL_FILTERS = [
  ['waiting', 'รอจัดการ'],
  ['urgent',  'เร่งด่วน'],
  ['matched', 'ตรงกับแผน'],
  ['outplan', 'นอกแผน'],
  ['closed',  'ปิดแล้ว'],
  ['',        'ทั้งหมด'],
  ['deleted', 'ถังขยะ']
];

const PL_REASONS = ['ตัดแล้ว', 'ไม่ใช่ต้นไม้ที่ต้องตัด', 'ซ้ำกับเรื่องอื่น', 'แจ้งผิดจุด'];

/* ---------- ป้ายตัวเลขบนปุ่มกล้อง ---------- */
async function patrolBadgeRefresh(){
  if(!S.user || !S.token) return;
  if(!PL.sum){                                   // มีตัวเลขเก่าอยู่ ขึ้นป้ายให้ก่อนเลย
    const warm = lsGet(plKey('waiting'));
    if(warm && warm.sum){ PL.sum = warm.sum; patrolBadgePaint(); }
  }
  try{
    const out = await tree2('patrolSummary', {});
    PL.sum = out;
    patrolBadgePaint();
  }catch(e){ /* เงียบไว้ ไม่ให้รบกวนการใช้งาน */ }
}
function patrolBadgePaint(){
  const fab = document.querySelector('.fab');
  if(!fab) return;
  let b = fab.querySelector('.fabdot');
  const n = PL.sum ? num(PL.sum.waiting) : 0;
  if(!n){ if(b) b.remove(); navDotPaint(0); return; }
  if(!b){ b = el('<span class="fabdot"></span>'); fab.appendChild(b); }
  b.textContent = n > 99 ? '99+' : n;
  b.style.background = (PL.sum && num(PL.sum.urgent)) ? '#B4402E' : '#C98A16';
  navDotPaint(n, b.style.background);
}

/* ป้ายตัวเลขบนเมนู ตรวจสอบ ของแถบล่าง เห็นงานค้างโดยไม่ต้องเข้าไปดู */
function navDotPaint(n, color){
  const btn = document.querySelector('#bnav button[data-v="check"]');
  if(!btn) return;
  let d = btn.querySelector('.navdot');
  if(!n){ if(d) d.remove(); return; }
  if(!d){ d = el('<span class="navdot"></span>'); btn.appendChild(d); }
  d.textContent = n > 99 ? '99+' : n;
  d.style.background = color || '#B4402E';
}

/* ---------- รายการ ---------- */
async function openPatrolList(filter){
  PL.filter = filter === undefined ? PL.filter : filter;
  openSheet('รายการพาโทรล', 'ปี ' + S.year, `
    <div id="plBody">${skChips(5)}${skList(4)}</div>`);
  await patrolLoad();
}

/* ---------- จำรายการไว้ในเครื่อง เปิดซ้ำเห็นทันที ---------- */
function plKey(f){ return 'pl_' + S.year + '_' + (f || PL.filter || 'all'); }
function plCacheSave(f, list){
  lsSet(plKey(f), {rows: list.rows || [], total: list.total, sum: list.sum || null, at: Date.now()});
}
function plCacheClear(){
  try{
    for(let i = localStorage.length - 1; i >= 0; i--){
      const k = localStorage.key(i);
      if(k && (k.indexOf(LS + '_pl_') === 0 || k.indexOf(LS + '_near_') === 0)) localStorage.removeItem(k);
    }
  }catch(e){}
  PL.near = {};
}

/* ผลการเทียบกับแผนของจุดเดิม คำตอบไม่เปลี่ยนจนกว่าข้อมูลในชีตจะเปลี่ยน
   จึงจำไว้ตามเลขรุ่นข้อมูล เปิดเรื่องเดิมซ้ำจะขึ้นทันทีโดยไม่ต้องคำนวณใหม่ */
async function patrolNearGet(id, opts){
  const o = opts || {};
  const key = 'near_' + id + '_' + S.year + '_' + (o.radius || 0) + '_' + (o.limit || 0);
  const now = String(S.stamp || '');
  const hit = PL.near[key] || lsGet(key);
  if(hit && hit.stamp === now && now){ PL.near[key] = hit; return hit.data; }
  const out = await tree2('patrolNear', Object.assign({patrolId: id, year: S.year}, o));
  const rec = {stamp: now, at: Date.now(), data: out};
  PL.near[key] = rec;
  lsSet(key, rec);
  return out;
}

async function patrolLoad(){
  const box = $('#plBody');
  const warm = lsGet(plKey());
  if(warm && warm.rows && warm.rows.length){
    /* มีของเก่าอยู่ วาดให้ดูก่อนเลย แล้วค่อยไปถามของจริงเงียบ ๆ */
    PL.rows = warm.rows; PL.sum = warm.sum;
    patrolListRender(warm.total, true);
  }else if(box){
    box.innerHTML = skChips(PL_FILTERS.length) + skList(4);
  }
  try{
    const list = await tree2('patrolList', {filter: PL.filter, limit: 150});
    PL.rows = list.rows || [];
    if(list.sum) PL.sum = list.sum;
    plCacheSave(PL.filter, list);
    patrolBadgePaint();
    patrolListRender(list.total);
  }catch(e){
    if(PL.rows && PL.rows.length){ toast(e.message); return; }   // ยังมีของเก่าให้ดู ไม่ต้องล้างจอ
    if($('#plBody')) $('#plBody').innerHTML = `<div class="card">
      <div class="sub" style="margin-bottom:10px">${esc(e.message)}</div>
      <button class="btn" style="width:100%" onclick="patrolLoad()">ลองใหม่อีกครั้ง</button></div>`;
  }
}

function plCount(key){
  const s = PL.sum || {};
  if(key === 'waiting') return num(s.waiting);
  if(key === 'urgent')  return num(s.urgent);
  if(key === 'matched') return num(s.matched);
  if(key === 'outplan') return num(s.outplan);
  if(key === 'closed')  return num(s.closed);
  if(key === 'deleted') return num(s.deleted);
  return num(s.total);
}

function plStatusPill(r){
  const st = String(r.Status||'');
  if(st === 'ลบแล้ว')              return '<span class="pill p-del">อยู่ในถังขยะ</span>';
  if(st === 'เปิดเป็นจุดที่พบแล้ว') return '<span class="pill p-ok">เปิดเป็นจุดที่พบแล้ว</span>';
  if(st === 'ปิดเรื่อง')          return '<span class="pill p-gray">ปิดเรื่อง</span>';
  if(st === 'นอกแผน')             return '<span class="pill p-gray">นอกแผน</span>';
  return '<span class="pill p-warn">รอจัดการ</span>';
}

/* เรื่องที่รับต่อมาจากแอป Patrol ระบบจำหน่าย */
function plFromPatrol(r){ return String(r.SrcApp||'').trim() === 'Patrol'; }

/* ===== แก้ไข · ลบลงถังขยะ · กู้คืน ===== */

const PL_DEL_WHY = ['แจ้งผิดจุด', 'ไม่ใช่งานตัดต้นไม้', 'แจ้งซ้ำกับเรื่องอื่น', 'ตัดไปแล้ว', 'ทดสอบระบบ'];

/* แก้หรือลบได้เฉพาะผู้แจ้งเอง ผู้จัดการ และหัวหน้าแผนก */
function plCanEdit(r){
  const me = String((S.user && S.user.name) || '');
  return String(r.By || '') === me || canOverride();
}

function plEditCard(r){
  const removed  = String(r.Status||'') === 'ลบแล้ว';
  const promoted = !!String(r.FindID||'').trim();
  const may = plCanEdit(r);

  if(removed){
    return `<div class="card" style="border-left:4px solid var(--gray)">
      <div class="plabel">อยู่ในถังขยะ</div>
      <div class="sub" style="margin-bottom:10px">
        ${esc(r.DelWhy || '')}${r.DelBy ? ' · โดย ' + esc(r.DelBy) : ''}${r.DelAt ? ' · ' + esc(String(r.DelAt).slice(0,16).replace('T',' ')) : ''}
      </div>
      ${may ? `<button class="btn" id="plRestoreBtn" style="width:100%;height:42px"
                 onclick="patrolRestore()">กู้คืนเรื่องนี้</button>`
            : `<div class="sub">กู้คืนได้เฉพาะผู้แจ้งเอง ผู้จัดการ และหัวหน้าแผนก</div>`}
    </div>`;
  }

  if(!may){
    return `<div class="card"><div class="sub">แก้ไขหรือลบได้เฉพาะผู้แจ้งเอง ผู้จัดการ และหัวหน้าแผนก</div></div>`;
  }

  return `<div class="card">
    <div class="plabel">จัดการเรื่องนี้</div>
    <div style="display:flex;gap:8px">
      <button class="btn ghost" style="flex:1;height:42px" onclick="openPatrolEdit()">แก้ไขข้อมูล</button>
      <button class="btn ghost" style="flex:1;height:42px;color:var(--bad);border-color:#E6C7C0"
        onclick="patrolAskDelete()" ${promoted ? 'disabled' : ''}>ลบเรื่องนี้</button>
    </div>
    ${promoted ? `<div class="sub" style="margin-top:7px">เรื่องนี้เปิดเป็นจุดที่พบในใบงานแล้ว ลบไม่ได้ ต้องไปจัดการที่จุดที่พบก่อน</div>` : ''}
  </div>`;
}

/* ---------- แก้ไข ---------- */
function openPatrolEdit(){

  if(!r) return;
  PL.edit = {
    severity: String(r.Severity || 'ปกติ'),
    note: String(r.Note || ''),
    lat: r.Lat, lng: r.Lng,
    jobId: String(r.JobID || ''), lineCode: String(r.LineCode || ''),
    placeName: String(r.PlaceName || ''), distM: r.DistM
  };

}

function patrolEditRender(){
  const e = PL.edit, r = PL.item;
  const promoted = !!String(r.FindID||'').trim();
  $('#piBody').innerHTML = `
    <div class="card fadein">
      <div class="plabel">ความรุนแรง</div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        ${['เร่งด่วน','ปกติ'].map(s => `<button class="btn ${e.severity===s?'':'ghost'}"
          style="flex:1;height:40px" onclick="PL.edit.severity='${s}';patrolEditRender()">${s}</button>`).join('')}

      <div class="plabel">ไลน์ที่ผูกอยู่</div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
        <div style="flex:1;font-size:13.5px">${e.lineCode ? esc(e.lineCode) + (e.placeName ? ' · ' + esc(e.placeName) : '') : 'ยังไม่ได้ผูกกับไลน์ไหน'}</div>

      </div>

      <div style="display:flex;gap:8px">
        <button class="btn ghost" style="flex:1;height:44px" onclick="patrolItemRender()">ยกเลิก</button>

      </div>

async function patrolEditGps(){
  btnBusy('#peGps', true, 'กำลังจับ…');
  try{
    const pos = await new Promise((ok, no) =>
      navigator.geolocation.getCurrentPosition(ok, no, {enableHighAccuracy:true, timeout:15000}));
    PL.edit.lat = +pos.coords.latitude.toFixed(6);
    PL.edit.lng = +pos.coords.longitude.toFixed(6);
    patrolEditRender();
    toast('จับพิกัดใหม่แล้ว');
  }catch(err){
    btnBusy('#peGps', false);
    toast('จับพิกัดไม่สำเร็จ กรุณาเปิดตำแหน่งที่ตั้ง');
  }
}

/* เลือกใบงานใหม่ระหว่างแก้ไข ใช้รายการเดียวกับตอนผูกครั้งแรก */
function patrolEditPickJob(){
  PL.edit.note = ($('#peNote') || {}).value !== undefined ? $('#peNote').value : PL.edit.note;
  const jobs = (S.data.jobs || []).slice().sort((a,b) => String(a.MJMNo||a.JobID).localeCompare(String(b.MJMNo||b.JobID)));
  $('#piBody').innerHTML = `
    <div class="card fadein">
      <div class="plabel">เลือกใบงานที่จะผูก</div>
      <button class="btn ghost" style="width:100%;height:40px;margin-bottom:10px"
        onclick="PL.edit.jobId='';PL.edit.lineCode='';PL.edit.placeName='';PL.edit.distM='';patrolEditRender()">
        ไม่ผูกกับใบงานไหน (นอกแผน)</button>
      <div style="max-height:52vh;overflow:auto">
        ${jobs.map(j => `<div class="plrow" onclick="patrolEditSetJob('${esc(j.JobID)}')">
          <div style="flex:1;min-width:0">
            <div style="font-size:13.5px;font-weight:600">${esc(j.MJMNo || j.JobID)}
              <span class="sub" style="font-weight:400"> · ${esc(j.FeederID||'')}</span></div>
            <div class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(j.JobName||'')}</div>
          </div></div>`).join('')}
      </div>
      <button class="btn ghost" style="width:100%;height:38px;margin-top:10px"
        onclick="patrolEditRender()">ยกเลิก</button>
    </div>`;
}
function patrolEditSetJob(jobId){
  const j = (S.data.jobs||[]).find(x => x.JobID === jobId) || {};
  PL.edit.jobId = jobId;
  PL.edit.lineCode = PL.edit.lineCode || String(j.MJMNo || '');
  PL.edit.placeName = PL.edit.placeName || String(j.JobName || '');
  patrolEditRender();
}

async function patrolSaveEdit(){
  if(PL.busy) return;
  const e = PL.edit;
  e.note = ($('#peNote') || {value:e.note}).value;
  PL.busy = true;
  btnBusy('#peSave', true, 'กำลังบันทึก…');
  try{
    const out = await tree2('patrolEdit', {
      patrolId: PL.item.PatrolID,
      severity: e.severity, note: e.note,
      lat: e.lat, lng: e.lng,
      jobId: e.jobId, lineCode: e.lineCode, placeName: e.placeName, distM: e.distM
    });
    markDirty();
    Object.assign(PL.item, {
      Severity: e.severity, Note: e.note, Lat: e.lat, Lng: e.lng,
      JobID: e.jobId, LineCode: e.lineCode, PlaceName: e.placeName, DistM: e.distM
    });
    toast((out.changed && out.changed.length) ? 'บันทึกแล้ว · ' + out.changed.join(' · ') : 'ไม่มีอะไรเปลี่ยน');
    patrolItemRender();
    patrolBadgeRefresh();
  }catch(err){
    btnBusy('#peSave', false);
    toast(err.message, 5000);
  }
  finally{ PL.busy = false; }
}

/* ---------- ลบลงถังขยะ ---------- */
function patrolAskDelete(){
  const r = PL.item;
  const fromPatrol = plFromPatrol(r);
  patrolItemRender(`
    <div class="card fadein" style="border-left:4px solid var(--bad)">
      <div style="font-weight:700;color:var(--bad);font-size:15px;margin-bottom:6px">ลบเรื่องนี้ออกจากคิว</div>
      <div class="sub" style="margin-bottom:12px;line-height:1.75">
        ไม่ได้ลบทิ้งถาวร เรื่องจะไปอยู่ในถังขยะ กู้คืนได้ตลอด
        ${fromPatrol ? '<br>ต้นเรื่องในแอป Patrol ยังอยู่ครบ ไม่ได้ถูกลบ' : ''}

      <div class="plabel">ลบเพราะอะไร</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${PL_DEL_WHY.map(x => `<button class="btn ghost" style="height:40px"

      </div>
      <button class="btn ghost" style="margin-top:12px;width:100%;height:38px"
        onclick="patrolItemRender()">ยกเลิก</button>
    </div>`);
}

async function patrolDoDelete(reason){
  if(PL.busy) return;
  PL.busy = true;
  try{
    await tree2('patrolDelete', {patrolId: PL.item.PatrolID, reason});
    markDirty();
    toast('ลบลงถังขยะแล้ว · กู้คืนได้ที่แถบถังขยะ', 4000);
    PL.item = Object.assign({}, PL.item, {
      Status: 'ลบแล้ว', DelWhy: reason, DelBy: (S.user && S.user.name) || '', DelAt: ''
    });
    patrolItemRender();
    patrolBadgeRefresh();
  }catch(e){ toast(e.message, 5000); }
  finally{ PL.busy = false; }
}

async function patrolRestore(){
  if(PL.busy) return;
  PL.busy = true;
  btnBusy('#plRestoreBtn', true, 'กำลังกู้คืน…');
  try{
    await tree2('patrolRestore', {patrolId: PL.item.PatrolID});
    markDirty();
    toast('กู้คืนแล้ว กลับมาอยู่ในคิวรอจัดการ');
    PL.item = Object.assign({}, PL.item, {Status: 'แจ้งแล้ว', DelWhy: '', DelBy: '', DelAt: ''});
    patrolItemRender();
    patrolBadgeRefresh();
  }catch(e){ btnBusy('#plRestoreBtn', false); toast(e.message, 5000); }
  finally{ PL.busy = false; }
}

/* ดึงเรื่องต้นไม้จากแอป Patrol เข้ามาเดี๋ยวนี้ ปกติระบบไปหยิบให้เองทุก 15 นาที */
async function patrolPullNow(){
  btnBusy('#plPullBtn', true, 'กำลังดึงจาก Patrol…');
  try{
    const out = await tree2('patrolPull');
    if(out.off) toast('สะพานรับเรื่องจาก Patrol ปิดอยู่');
    else if(out.added) toast('รับเรื่องใหม่เข้ามา ' + out.added + ' เรื่อง');
    else toast('ไม่มีเรื่องต้นไม้ใหม่จาก Patrol');
    plCacheClear();
    await patrolLoad();
  }catch(e){
    toast(e.message || 'ดึงไม่สำเร็จ');
    btnBusy('#plPullBtn', false);
  }
}

                       : `<div class="plth" style="background:var(--line2)"></div>`}
          <div style="flex:1;min-width:0">
            <div style="font-size:13.5px;font-weight:600">${esc(r.LineCode || 'นอกแผน')}
              ${r.DistM !== '' && r.DistM !== undefined ? `<span class="sub" style="font-weight:400"> · ${esc(r.DistM)} ม.</span>` : ''}</div>
            <div class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.PlaceName || r.Note || '—')}</div>
            <div class="sub">${esc(r.By || '')} · ${esc(thaiDateShort(r.Date))} ${esc(r.Time || '')}</div>
            ${plFromPatrol(r) ? `<div style="margin-top:3px"><span class="pill p-src">มาจาก Patrol</span></div>` : ''}
          </div>
          <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0">
            <span class="pill ${String(r.Severity)==='เร่งด่วน'?'p-bad':'p-gray'}">${esc(r.Severity || 'ปกติ')}</span>
            ${plStatusPill(r)}
          </div>
        </div>`).join('')}
    </div>
    <div class="sub" style="text-align:center">แสดง ${PL.rows.length} จาก ${esc(total)} รายการ · แตะที่แถวเพื่อสั่งงานต่อ</div>`
    : `<div class="card"><div class="sub">ไม่มีรายการในหมวดนี้</div></div>`}`;
}

/* รูปจากไดรฟ์ ใช้ลิงก์แบบ thumbnail จะโหลดเร็วกว่าและไม่โดนบล็อก */
function photoThumb(r){
  if(r.FileID) return 'https://drive.google.com/thumbnail?id=' + r.FileID + '&sz=w200';
  return r.PhotoUrl || '';
}

/* ---------- รายละเอียด ---------- */
async function openPatrolItem(id){
  let r = PL.rows.find(x => x.PatrolID === id);
  openSheet('รายละเอียดพาโทรล', id, `<div id="piBody">${skPhoto()}${skCard(4)}${skCard(2)}</div>`);
  if(!r){
    try{
      const out = await tree2('patrolList', {limit: 500});
      PL.rows = out.rows || [];
      r = PL.rows.find(x => x.PatrolID === id);
    }catch(e){}
  }
  if(!r){ $('#piBody').innerHTML = `<div class="card"><div class="sub">ไม่พบรายการ ${esc(id)}</div></div>`; return; }
  PL.item = r;
  patrolItemRender();
  if(!String(r.JobID||'').trim() && String(r.Status||'') !== 'ปิดเรื่อง') patrolLoadNear(id);
  else if(String(r.JobID||'').trim()) patrolLoadPlan(id);
}

function patrolItemRender(extra){
  const r = PL.item;
  if(!r) return;
  const job = (S.data.jobs||[]).find(j => j.JobID === r.JobID);
  const removed = String(r.Status||'') === 'ลบแล้ว';
  const closed  = String(r.Status||'') === 'ปิดเรื่อง' || removed;
  const promoted = !!String(r.FindID||'').trim();
  const matched = !!String(r.JobID||'').trim();
  const map = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(r.Lat + ',' + r.Lng);

  $('#piBody').innerHTML = `
    ${r.PhotoUrl ? `<a href="${esc(r.PhotoUrl)}" target="_blank" rel="noopener">
      <img src="${esc(photoThumbBig(r))}" style="width:100%;border-radius:12px;display:block" alt="รูปที่ถ่ายจากหน้างาน"></a>` : ''}

    <div class="card">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <span class="pill ${String(r.Severity)==='เร่งด่วน'?'p-bad':'p-gray'}">${esc(r.Severity || 'ปกติ')}</span>
        ${matched ? `<span class="pill p-ok">ห่างจุดในแผน ${esc(r.DistM)} ม.</span>`
                  : `<span class="pill p-warn">นอกแผน</span>`}
        ${plStatusPill(r)}
      </div>
      <div style="display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px">
        <div class="sub">ผู้แจ้ง</div><div>${esc(r.By || '')}</div>
        <div class="sub">เวลา</div><div>${esc(thaiDateShort(r.Date))} ${esc(r.Time || '')}</div>
        ${plFromPatrol(r) ? `<div class="sub">ที่มา</div>
          <div>Patrol ระบบจำหน่าย <span class="sub">· ${esc(r.SrcID || '')}</span></div>` : ''}
        ${matched ? `
          <div class="sub">ไลน์</div><div style="font-weight:600">${esc(r.LineCode)}</div>
          <div class="sub">สถานที่</div><div>${esc(r.PlaceName || '-')}</div>
          <div class="sub">ใบงาน</div><div style="font-weight:600">${esc(job ? (job.MJMNo||job.JobID) : r.JobID)}</div>
          <div class="sub">ฟีดเดอร์</div><div>${esc(job ? (job.FeederID||'') : '')} ${esc(job ? (job.VoltLevel||'') : '')}</div>
          <div class="sub">ผู้รับจ้าง</div><div>${esc(job ? (job.Contractor||'-') : '-')}</div>` : ''}
        ${r.Note ? `<div class="sub">หมายเหตุ</div><div>${esc(r.Note)}</div>` : ''}
      </div>
    </div>

    ${extra || ''}

    <div class="card">
      <div class="plabel">สั่งงานต่อ</div>
      ${promoted ? `<div class="sub" style="margin-bottom:10px">เปิดเป็นจุดที่พบแล้ว รหัส ${esc(r.FindID)}</div>`
        : (closed ? `<div class="sub" style="margin-bottom:10px">${removed ? 'เรื่องนี้อยู่ในถังขยะ กู้คืนก่อนจึงจะสั่งงานต่อได้' : 'เรื่องนี้ปิดแล้ว'}</div>`
        : (matched ? `
          <button class="btn" style="width:100%;height:44px" onclick="patrolPromote()">เปิดเป็นจุดที่พบในใบงาน</button>
          <div class="sub" style="margin-top:6px">จะไปอยู่ในรายการจุดที่พบ และล็อกการตรวจรับรอบนั้นจนกว่าจะปรับปรุงเสร็จ</div>` : ''))}
      <div style="display:flex;gap:8px;margin-top:12px">
        <a class="btn ghost" style="flex:1;height:40px;display:flex;align-items:center;justify-content:center;text-decoration:none"
           href="${esc(map)}" target="_blank" rel="noopener">เปิดแผนที่</a>
        ${matched ? `<button class="btn ghost" style="flex:1;height:40px"
           onclick="closeSheet();openLineInfo('${esc(r.LineCode)}')">เปิดใบงาน</button>` : ''}
      </div>
      ${closed ? '' : `<button class="btn ghost" style="margin-top:8px;width:100%;height:40px"
        onclick="patrolAskClose()">ปิดเรื่อง ไม่ต้องทำอะไร</button>`}

    ${plEditCard(r)}

    <button class="btn ghost" style="width:100%;height:40px" onclick="openPatrolList()">กลับไปรายการ</button>`;

function photoThumbBig(r){
  if(r.FileID) return 'https://drive.google.com/thumbnail?id=' + r.FileID + '&sz=w1000';
  return r.PhotoUrl || '';
}

/* ---------- นอกแผน: ไลน์ใกล้สุดสามเส้น ---------- */
/* เรื่องที่ตรงกับแผนแล้ว ดึงรายละเอียดแผนและรอบตัดมาแสดงเพิ่ม */
async function patrolLoadPlan(id){
  try{
    const r = PL.item;
    const out = await patrolNearGet(id, {limit: 4, radius: 400});
    const list = out.near || [];
    const code = String(r.LineCode||'').replace(/\s+/g,'').toUpperCase();
    const m = list.find(x => String(x.lineCode||'').replace(/\s+/g,'').toUpperCase() === code) || list[0];
    if(!m || PL.item !== r) return;
    patrolItemRender(`
      <div class="card fadein" style="border-left:4px solid var(--ok)">
        <div class="plabel">แผนงานและรอบตัด</div>
        <div style="display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px">
          ${m.segFrom ? `<div class="sub">ช่วงสาย</div><div>${esc(m.segFrom)}${m.segTo ? ' ถึง ' + esc(m.segTo) : ''}</div>` : ''}
          <div class="sub">ห่างแนวสาย</div><div style="font-weight:600">${esc(m.distM)} เมตร</div>
          <div class="sub">ใบงาน</div><div style="font-weight:600">${esc(m.mjmNo || m.jobId)}</div>
          <div class="sub">ชื่องาน</div><div>${esc(m.jobName || '-')}</div>
          <div class="sub">ผู้รับจ้าง</div><div style="font-weight:600">${esc(m.contractor || '-')}</div>
          <div class="sub">ฟีดเดอร์</div><div>${esc(m.feeder || '-')} · ${esc(m.voltLevel || m.system || '')} · แผน ${esc(m.planKm || '-')} กม.</div>
          ${planRoundBlock(m.round)}
        </div>
      </div>`);
  }catch(e){ /* ไม่ขึ้นก็ไม่เป็นไร หน้าหลักยังใช้ได้ */ }
}

async function patrolLoadNear(id){
  try{
    const out = await patrolNearGet(id, {limit: 3});
    const near = out.near || [];
    const html = `
      <div class="card" style="border-left:4px solid var(--warn)">
        <div style="font-weight:600">ไม่มีแนวสายในแผนอยู่ในรัศมี</div>
        <div class="plabel" style="margin-top:12px">ไลน์ที่ใกล้ที่สุด เลือกผูกได้เลย</div>
        ${near.length ? near.map(n => `
          <div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line2)">
            <div style="flex:1;min-width:0">
              <div style="font-size:13.5px;font-weight:600">${esc(n.lineCode)}
                <span class="sub" style="font-weight:400"> · ห่างแนวสาย ${esc(n.distM)} ม.</span></div>
              <div class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(n.mjmNo||'')} · ${esc(n.contractor||'-')}</div>
              <div class="sub">${esc(roundOneLine(n.round))}</div>
            </div>
            <button class="btn" style="height:34px;padding:0 12px;flex-shrink:0"
              onclick="patrolAssign('${esc(n.jobId)}','${esc(n.lineCode)}',${Number(n.distM)||0},'${esc((n.placeName||'').replace(/'/g,''))}')">ผูกกับใบนี้</button>
          </div>`).join('')
          : '<div class="sub">ไม่พบไลน์ในแผนในระยะ 5 กิโลเมตร</div>'}
        <button class="btn ghost" style="margin-top:12px;width:100%;height:38px" onclick="patrolPickJob()">เลือกจากรายการทั้งหมด</button>
      </div>`;
    patrolItemRender(html);
  }catch(e){ /* ปล่อยหน้าไว้อย่างเดิม */ }
}

function patrolPickJob(){
  const jobs = (S.data.jobs||[]).slice().sort((a,b) => String(a.MJMNo||'').localeCompare(String(b.MJMNo||'')));
  const html = `
    <div class="card">
      <div class="plabel">เลือกใบงานเอง</div>
      <select class="inp" id="piJob" style="width:100%;height:42px">
        ${jobs.map(j => `<option value="${esc(j.JobID)}">${esc(j.MJMNo||j.JobID)} · ${esc(j.FeederID||'')} · ${esc((j.JobName||'').slice(0,40))}</option>`).join('')}
      </select>
      <button class="btn" style="margin-top:10px;width:100%;height:42px"
        onclick="patrolAssign($('#piJob').value,'',0,'')">ผูกกับใบงานที่เลือก</button>
      <button class="btn ghost" style="margin-top:8px;width:100%;height:38px"
        onclick="patrolLoadNear(PL.item.PatrolID)">กลับไปดูไลน์ใกล้สุด</button>
    </div>`;
  patrolItemRender(html);
}

async function patrolAssign(jobId, lineCode, distM, placeName){
  if(PL.busy) return;
  PL.busy = true;
  try{
    await tree2('patrolAssign', {patrolId: PL.item.PatrolID, jobId, lineCode, distM, placeName});
    markDirty();
    toast('ผูกเข้าใบงานแล้ว');
    PL.item = Object.assign({}, PL.item, {JobID: jobId, LineCode: lineCode || PL.item.LineCode,
      DistM: distM || PL.item.DistM, PlaceName: placeName || PL.item.PlaceName, Status: 'แจ้งแล้ว'});
    patrolItemRender();
  }catch(e){ toast(e.message, 5000); }
  finally{ PL.busy = false; }
}

/* ---------- ยกระดับ / ปิดเรื่อง ---------- */
async function patrolPromote(){
  if(PL.busy) return;
  PL.busy = true;
  try{
    const out = await tree2('patrolClose', {patrolId: PL.item.PatrolID, promote: 1});
    markDirty();
    toast('เปิดเป็นจุดที่พบแล้ว ' + (out.findId || ''));
    PL.item = Object.assign({}, PL.item, {Status: 'เปิดเป็นจุดที่พบแล้ว', FindID: out.findId});
    patrolItemRender();
    patrolBadgeRefresh();
  }catch(e){ toast(e.message, 5000); }
  finally{ PL.busy = false; }
}

function patrolAskClose(){
  const html = `
    <div class="card" style="border-left:4px solid var(--warn)">
      <div class="plabel">ปิดเรื่องเพราะอะไร</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${PL_REASONS.map(x => `<button class="btn ghost" style="height:40px"
          onclick="patrolDoClose('${esc(x)}')">${esc(x)}</button>`).join('')}
      </div>
      <div class="plabel" style="margin-top:12px">หรือพิมพ์เอง</div>
      <input class="inp" id="piWhy" style="width:100%" placeholder="เหตุผล">
      <button class="btn" style="margin-top:10px;width:100%;height:42px"
        onclick="patrolDoClose(($('#piWhy').value||'').trim())">ปิดเรื่อง</button>
      <button class="btn ghost" style="margin-top:8px;width:100%;height:38px"
        onclick="patrolItemRender()">ยกเลิก</button>
    </div>`;
  patrolItemRender(html);
}

async function patrolDoClose(reason){
  if(!reason){ toast('เลือกหรือพิมพ์เหตุผลก่อน'); return; }
  if(PL.busy) return;
  PL.busy = true;
  try{
    await tree2('patrolClose', {patrolId: PL.item.PatrolID, reason});
    markDirty();
    toast('ปิดเรื่องแล้ว');
    PL.item = Object.assign({}, PL.item, {Status: 'ปิดเรื่อง'});
    patrolItemRender();
    patrolBadgeRefresh();
  }catch(e){ toast(e.message, 5000); }
  finally{ PL.busy = false; }
}

/* ---------- เปิดจากลิงก์ในไลน์ ---------- */
function patrolDeepLink(){
  let q;
  try{ q = new URLSearchParams(location.search); }catch(e){ return; }
  const id = q.get('patrol');
  const view = q.get('view');
  if(!id && view !== 'patrol') return;
  /* ล้าง query ออกจากแถบที่อยู่ กันเปิดซ้ำตอนรีเฟรช */
  try{ history.replaceState({}, '', location.pathname); }catch(e){}
  setTimeout(() => { if(id) openPatrolItem(id); else openPatrolList('waiting'); }, 400);
}

const TH_MONTH_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                       'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
/* ในชีตเก็บวันที่เป็น พ.ศ. อยู่แล้ว ถ้าเจอปีน้อยกว่า 2400 ถือว่าเป็น ค.ศ. จึงบวกให้ */
function beYear(y){ y = Number(y)||0; return y < 2400 ? y + 543 : y; }
function thaiDate(iso){
  const s = String(iso || '').slice(0,10);
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(!m) return s || '-';
  return Number(m[3]) + ' ' + TH_MONTH_FULL[Number(m[2])-1] + ' ' + beYear(m[1]);
}
const TH_MONTH_ABBR = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.',
                       'ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thaiDateShort(iso){
  const s = String(iso || '').slice(0,10);
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(!m) return s || '-';
  return Number(m[3]) + ' ' + TH_MONTH_ABBR[Number(m[2])-1] + ' ' + beYear(m[1]);
}

async function openPayReport(jobId, no){
  openSheet('รายงานเบิกจ่ายเงิน', 'งวดที่ ' + no, `
    <div id="prBody"><div class="card"><div class="sub">กำลังรวบรวมข้อมูล…</div></div></div>`);
  try{
    const r = await tree2('payReport', {jobId, installment: no});
    window.__payReport = r;
    payReportForm(r);
  }catch(e){
    $('#prBody').innerHTML = `<div class="card"><div class="sub">${esc(e.message)}</div></div>`;
  }
}

function payReportForm(r){
  const cm = r.committee || [];
  const needDoc = !r.docNo;
  const draft = !r.canIssue;                       // ยังไม่ผ่านการตรวจรับ = ได้แค่ฉบับร่าง
  const why = r.blockReason || 'รอบนี้ยังไม่ผ่านการตรวจรับ';
  $('#prBody').innerHTML = `
    ${draft ? `<div class="card" style="border-left:4px solid var(--warn);background:var(--warn-soft)">
        <div style="font-weight:600">พิมพ์ได้เฉพาะฉบับร่าง</div>
        <div class="sub" style="margin-top:4px">${esc(why)}</div>
        <div class="sub" style="margin-top:6px">ฉบับร่างจะมีคำว่า ร่าง ทับกลางหน้าทุกหน้า ใช้ดูหรือทานก่อนได้ แต่ใช้ตั้งเบิกไม่ได้</div>
      </div>` : ''}
    <div class="card">
      <div class="kanit" style="font-size:17px">${esc(r.job.MJMNo || r.job.JobID)}</div>
      <div class="sub">${esc(r.job.JobName || '')}</div>
      <div style="margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px">
        <div class="sub">งวดที่</div><div>${esc(r.installment)} · ร้อยละ ${esc(r.percent)}</div>
        <div class="sub">จำนวนเงิน</div><div style="font-weight:600">${fmt0(r.amount)} บาท</div>
        <div class="sub">ราคาตามสัญญา</div><div>${fmt0(r.contractPrice)} บาท</div>
        <div class="sub">ตัดแล้ว</div><div>${esc(r.cutCount)} จาก ${esc(r.lineCount)} ไลน์</div>
        <div class="sub">วันตรวจรับ</div><div>${r.round && r.round.AcceptDate ? esc(thaiDate(r.round.AcceptDate)) : '<span style="color:var(--warn)">ยังไม่ได้ลง</span>'}</div>
        <div class="sub">สถานะรอบ</div><div>${esc((r.round && r.round.Status) || '—')}</div>
        <div class="sub">เลขหนังสือ</div><div>${r.docNoFull ? esc(r.docNoFull) : '<span style="color:var(--warn)">ยังไม่ได้ออกเลข</span>'}</div>
      </div>
    </div>

    <div class="card">
      <div class="plabel">คณะกรรมการตรวจรับ ปี ${esc(r.job.Year)}</div>
      ${cm.length ? cm.map(c => `<div style="display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line2)">
          <div style="flex:1"><div style="font-size:13.5px;font-weight:600">${esc(c.Name || '(ยังไม่ได้ใส่ชื่อ)')}</div>
          <div class="sub">${esc(c.Position || '')}</div></div>
          <span class="pill ${String(c.Role).indexOf('ประธาน')>=0 ? 'p-ok' : 'p-gray'}">${esc(c.Role)}</span>
        </div>`).join('')
        : '<div class="sub">ยังไม่ได้ใส่รายชื่อของปีนี้</div>'}
      <button class="btn ghost" style="margin-top:10px;width:100%;height:38px"
        onclick="openCommittee('${esc(r.job.Year)}')">แก้รายชื่อคณะกรรมการ</button>
    </div>

    <div class="card">
      ${needDoc ? `
        <button class="btn" style="width:100%;height:46px" id="prDoc" onclick="payIssueDoc('${esc(r.job.JobID)}', ${Number(r.installment)})"
          ${r.canIssue && r.bookReady ? '' : 'disabled'}>ออกเลขหนังสือจากระบบทะเบียน</button>
        <div class="sub" style="margin-top:8px">
          ${!r.bookReady ? 'ยังไม่ได้ตั้งค่า BOOKNO_URL และ BOOKNO_KEY ในแท็บ Config'
            : (draft ? esc(why) + ' จึงยังออกเลขไม่ได้'
            : 'ออกเลขครั้งเดียว พิมพ์ซ้ำกี่ครั้งก็ใช้เลขเดิม')}
        </div>` : ''}
      <button class="btn ${needDoc ? 'ghost' : ''}" style="margin-top:${needDoc?'10px':'0'};width:100%;height:46px"
        onclick="payPrint()">${draft ? 'พิมพ์ฉบับร่าง' : 'พิมพ์รายงาน'}</button>
      <div class="sub" style="margin-top:8px">${draft
        ? 'เปิดดูเต็มหน้าในแอป มีปุ่มปิดกลับมาหน้านี้ได้'
        : 'พิมพ์ได้โดยไม่ต้องมีเลขหนังสือ ช่องเลขที่จะเว้นว่างไว้ให้เขียนมือ'}</div>
    </div>`;
}

async function payIssueDoc(jobId, no){
  const b = $('#prDoc');
  if(b){ b.disabled = true; b.textContent = 'กำลังขอเลข…'; }
  try{
    const out = await tree2('payDocNo', {jobId, no});
    markDirty();
    toast('ได้เลขหนังสือ ' + (out.docNoFull || out.docNo));
    const r = await tree2('payReport', {jobId, installment: no});
    window.__payReport = r;
    payReportForm(r);
  }catch(e){
    toast(e.message, 5000);
    if(b){ b.disabled = false; b.textContent = 'ออกเลขหนังสือจากระบบทะเบียน'; }
  }
}

/* เปิดรายงานเต็มจอทับแอป มีแถบหัวให้กดปิดกลับได้ตลอด
   เดิมใช้ window.open ซึ่งบนมือถือไม่มีปุ่มย้อนกลับ ออกไม่ได้นอกจากปิดแอป */
function payPrint(){
  const r = window.__payReport;
  if(!r){ toast('ยังไม่มีข้อมูล'); return; }
  const draft = !r.canIssue;
  closePrintView();
  const box = el(`
    <div id="printView">
      <div class="pvbar">
        <button type="button" class="pvclose" onclick="closePrintView()" aria-label="ปิด">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
          ปิด
        </button>
        <div class="pvtitle">${draft ? 'ฉบับร่าง' : 'รายงานเบิกจ่าย'} · งวดที่ ${esc(r.installment)}</div>
        <button type="button" class="pvprint" onclick="doPrintView()">สั่งพิมพ์</button>
      </div>
      <iframe id="pvFrame" title="รายงานเบิกจ่าย"></iframe>
    </div>`);
  document.body.appendChild(box);
  document.body.style.overflow = 'hidden';
  const f = box.querySelector('#pvFrame');
  /* ปุ่มสั่งพิมพ์ในตัวเอกสารซ้ำกับปุ่มบนแถบหัว ซ่อนทิ้งเวลาดูในแอป */
  f.addEventListener('load', () => {
    try{ f.contentDocument.querySelectorAll('.noprint').forEach(e => e.remove()); }catch(e){}
  });
  f.srcdoc = payReportHtml(r);
  window.addEventListener('keydown', pvEsc);
  history.pushState({pv:1}, '');            // ปุ่มย้อนกลับของเครื่องก็ปิดได้
  window.addEventListener('popstate', pvPop);
}
function pvEsc(e){ if(e.key === 'Escape') closePrintView(); }
function pvPop(){ const b = $('#printView'); if(b) closePrintView(true); }
function closePrintView(fromBack){
  const b = $('#printView');
  window.removeEventListener('keydown', pvEsc);
  window.removeEventListener('popstate', pvPop);
  if(!b) return;
  b.remove();
  document.body.style.overflow = '';
  if(!fromBack && history.state && history.state.pv) history.back();
}
function doPrintView(){
  const f = $('#pvFrame');
  if(!f){ return; }
  try{
    f.contentWindow.focus();
    f.contentWindow.print();
  }catch(e){
    toast('เครื่องนี้สั่งพิมพ์จากในแอปไม่ได้ ใช้เมนูแชร์ของเบราว์เซอร์แล้วเลือกพิมพ์แทน', 5000);
  }
}

/* ============================================================
   รายงานรวมหลายใบงานในงวดเดียว
   เลือกได้สองทาง  ตามกลุ่มเดือนในแผน  หรือ  ติ๊กเองทีละใบ
   ============================================================ */
let BAT = { no: 1, mode: 'group', group: '', contractor: '', picked: {}, data: null, busy: false };

function openPayBatch(){
  const d = S.data;
  if(!d || !d.jobs){ toast('ยังไม่มีข้อมูล'); return; }
  BAT = { no: 1, mode: 'group', group: '', picked: {}, data: null, busy: false };
  const g = batGroups();
  BAT.group = g.length ? g[0].planMonths : '';
  batApplyGroup();
  openSheet('พิมพ์รวมหลายใบงาน', 'ปี ' + S.year, `<div id="batBody"></div>`);
  batRender();
}

/* จัดกลุ่มใบงานรายปีตามเดือนในแผน ใช้ข้อมูลที่โหลดมาแล้วในเครื่อง */
function batGroups(){
  const g = {};
  (S.data.jobs||[]).forEach(j => {
    if(String(j.JobType||'') !== 'รายปี') return;
    if(!sameContractor(j, BAT.contractor)) return;
    const k = String(j.PlanMonths||'').trim() || '(ยังไม่ระบุเดือน)';
    if(!g[k]) g[k] = { planMonths:k, monthGroup:j.MonthGroup||'', jobs:[] };
    g[k].jobs.push(j);
  });
  return Object.keys(g).map(k => g[k])
    .sort((a,b) => (num(a.monthGroup)||99) - (num(b.monthGroup)||99));
}

function batJobList(){
  return (S.data.jobs||[]).filter(j => String(j.JobType||'') === 'รายปี' && sameContractor(j, BAT.contractor))
    .sort((a,b) => String(a.MJMNo||'').localeCompare(String(b.MJMNo||'')));
}

function batApplyGroup(){
  BAT.picked = {};
  const gs = batGroups();
  let g = gs.find(x => x.planMonths === BAT.group);
  if(!g && gs.length){ g = gs[0]; BAT.group = g.planMonths; }   // กลุ่มเดิมไม่มีของผู้รับจ้างรายนี้ ใช้กลุ่มแรกแทน
  if(g) g.jobs.forEach(j => BAT.picked[j.JobID] = true);
}

function batPickedIds(){ return Object.keys(BAT.picked).filter(k => BAT.picked[k]); }

function batAmountOf(jobId){
  const p = (S.data.payments||[]).find(x => x.JobID === jobId && num(x.Installment) === num(BAT.no));
  if(p && num(p.Amount)) return num(p.Amount);
  const j = (S.data.jobs||[]).find(x => x.JobID === jobId) || {};
  const pct = p && num(p.Percent) ? num(p.Percent) : (BAT.no === 3 ? 20 : 40);
  return Math.round(num(j.ContractPrice) * pct) / 100;
}

        <div class="sub" style="margin-top:8px">เลือกกลุ่มแล้วระบบติ๊กใบงานในกลุ่มให้ทั้งหมด

    </div>

        : 'เอกสารชุดนี้ใช้เลขหนังสือเลขเดียว ลงชื่อกรรมการชุดเดียว'}</div>

function batAll(on){
  BAT.picked = {};
  if(on) batJobList().forEach(j => BAT.picked[j.JobID] = true);
  batRender();
}

async function batOpen(){
  const ids = batPickedIds();
  if(!ids.length){ toast('ยังไม่ได้เลือกใบงาน'); return; }
  const b = $('#batGo');
  if(b){ b.disabled = true; b.textContent = 'กำลังรวบรวมข้อมูล…'; }
  try{
    const r = await tree2('payReportSet', {jobIds: JSON.stringify(ids), installment: BAT.no});
    BAT.data = r;
    window.__paySet = r;
    batForm(r);
  }catch(e){
    toast(e.message, 5000);
    if(b){ b.disabled = false; b.textContent = 'ดูรายงานรวม ' + ids.length + ' ใบงาน'; }
  }
}

    <div class="card">
      <div class="kanit" style="font-size:17px">รายงานรวม งวดที่ ${esc(r.installment)}</div>
      <div class="sub">${esc(r.count)} ใบงาน · ปี ${esc(r.year)}</div>
      <div style="margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px">
        <div class="sub">รวมเป็นเงิน</div><div style="font-weight:600">${fmt0(r.total)} บาท</div>
        <div class="sub">เลขหนังสือ</div><div>${r.docNoFull ? esc(r.docNoFull)
          : '<span style="color:var(--warn)">ยังไม่ได้ออกเลข</span>'}</div>
      </div>
      <div style="margin-top:12px;max-height:34vh;overflow:auto">
        ${r.items.map((it,i) => `<div style="display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line2)">
          <div class="ic-n">${i+1}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13.5px;font-weight:600">${esc(it.mjmNo)}
              <span class="sub" style="font-weight:400"> · ${esc(it.feeder)}</span></div>
            <div class="sub">${esc(it.contractor||'ยังไม่ระบุผู้รับจ้าง')} · ตัดแล้ว ${esc(it.cutCount)}/${esc(it.lineCount)} ไลน์</div>
            ${it.ready ? '' : `<div class="sub" style="color:var(--warn)">${esc(it.blockReason)}</div>`}
          </div>
          <div style="text-align:right;font-size:13px;font-weight:600;white-space:nowrap">${fmt0(it.amount)}</div>
        </div>`).join('')}
      </div>
      <button class="btn ghost" style="margin-top:12px;width:100%;height:38px" onclick="batRender()">กลับไปเลือกใหม่</button>
    </div>

    <div class="card">
      ${needDoc ? `
        <button class="btn" style="width:100%;height:46px" id="batDoc" onclick="batIssueDoc()"
          ${(!draft && r.bookReady && !r.mixedDocNo) ? '' : 'disabled'}>ออกเลขหนังสือหนึ่งเลขให้ทั้งชุด</button>
        <div class="sub" style="margin-top:8px">${!r.bookReady
          ? 'ยังไม่ได้ตั้งค่า BOOKNO_URL และ BOOKNO_KEY ในแท็บ Config'
          : (draft ? 'ต้องตรวจรับให้ครบทุกใบก่อน' : 'หนึ่งชุดหนึ่งเลข เลขเดียวกันจะถูกเขียนลงทุกใบงานในชุด')}</div>` : ''}
      <button class="btn ${needDoc ? 'ghost' : ''}" style="margin-top:${needDoc?'10px':'0'};width:100%;height:46px"
        onclick="batPrint()">${draft ? 'พิมพ์ฉบับร่าง' : 'พิมพ์รายงานรวม'}</button>
    </div>`;
}

async function batIssueDoc(){
  const r = BAT.data;
  const b = $('#batDoc');
  if(b){ b.disabled = true; b.textContent = 'กำลังขอเลข…'; }
  try{
    const out = await tree2('payDocNoSet', {jobIds: JSON.stringify(r.items.map(x=>x.jobId)), no: r.installment});
    markDirty();
    toast('ได้เลขหนังสือ ' + (out.docNoFull || out.docNo));
    const fresh = await tree2('payReportSet', {jobIds: JSON.stringify(r.items.map(x=>x.jobId)), installment: r.installment});
    BAT.data = fresh; window.__paySet = fresh;
    batForm(fresh);
  }catch(e){
    toast(e.message, 6000);
    if(b){ b.disabled = false; b.textContent = 'ออกเลขหนังสือหนึ่งเลขให้ทั้งชุด'; }
  }
}

function batPrint(){
  const r = BAT.data;
  if(!r){ toast('ยังไม่มีข้อมูล'); return; }
  const draft = !r.canIssue;
  closePrintView();
  const box = el(`
    <div id="printView">
      <div class="pvbar">
        <button type="button" class="pvclose" onclick="closePrintView()" aria-label="ปิด">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
          ปิด
        </button>
        <div class="pvtitle">${draft ? 'ฉบับร่าง' : 'รายงานรวม'} · งวดที่ ${esc(r.installment)} · ${esc(r.count)} ใบงาน</div>
        <button type="button" class="pvprint" onclick="doPrintView()">สั่งพิมพ์</button>
      </div>
      <iframe id="pvFrame" title="รายงานเบิกจ่ายรวม"></iframe>
    </div>`);
  document.body.appendChild(box);
  document.body.style.overflow = 'hidden';
  const f = box.querySelector('#pvFrame');
  f.addEventListener('load', () => {
    try{ f.contentDocument.querySelectorAll('.noprint').forEach(e => e.remove()); }catch(e){}
  });
  f.srcdoc = paySetHtml(r);
  window.addEventListener('keydown', pvEsc);
  history.pushState({pv:1}, '');
  window.addEventListener('popstate', pvPop);
}

/* ---------- เอกสารรวม ---------- */
function paySetHtml(r){
  const draft = !r.canIssue;
  const cm = (r.committee || []).filter(c => String(c.Name || '').trim() !== '');
  const sg = r.signers || {};
  const km = r.items.reduce((a,x) => a + num(x.planKm), 0);
  const cut = r.items.reduce((a,x) => a + num(x.cutCount), 0);
  const all = r.items.reduce((a,x) => a + num(x.lineCount), 0);
  const contractors = {};
  r.items.forEach(x => { if(x.contractor) contractors[x.contractor] = (contractors[x.contractor]||0) + 1; });
  const accDates = r.items.map(x => x.acceptDate).filter(Boolean).sort();

  const sign = (name, pos, label) => `
    <div class="sg">
      <div class="ln">(ลงชื่อ)…………………………………………</div>
      <div class="nm">( ${esc(name || '…………………………………………')} )</div>
      <div class="ps">${esc(pos || '')}</div>
      ${label ? `<div class="ps">${esc(label)}</div>` : ''}
    </div>`;

  return `<!doctype html><html lang="th"><head><meta charset="utf-8">
<title>รายงานเบิกจ่ายรวม งวดที่ ${esc(r.installment)}</title>
<style>${payReportCss()}</style></head><body>
<div class="noprint"><button onclick="window.print()">สั่งพิมพ์</button></div>

<img class="seal" src="${PEA_SEAL}" alt="การไฟฟ้าส่วนภูมิภาค">
<h1>เอกสารแนบท้ายบันทึก</h1>
<div class="sub">รายงานผลการตรวจรับงานจ้างเหมาตัดต้นไม้ใกล้แนวระบบจำหน่าย<br>
และขออนุมัติเบิกจ่ายเงิน งวดที่ ${esc(r.installment)} รวม ${esc(r.count)} ใบงาน</div>
${draft ? `<div class="draftnote">ฉบับร่าง — ${esc(r.blockReason)} ใช้ตั้งเบิกไม่ได้</div>` : ''}
<div class="docno">${draft ? '<b style="color:#B4402E">ฉบับร่าง</b> &nbsp; ' : ''}เลขที่ ${esc(r.docNoFull || '……………………')}</div>

<table class="kv">
  <tr><td>หน่วยงาน</td><td>${esc(r.org)}</td></tr>
  <tr><td>ปีงบประมาณ</td><td>${esc(r.year)}</td></tr>
  <tr><td>จำนวนใบงาน</td><td>${esc(r.count)} ใบงาน</td></tr>
  <tr><td>ระยะทางตามแผนรวม</td><td>${fmt(km)} กิโลเมตร</td></tr>
  <tr><td>ผู้รับจ้าง</td><td>${esc(Object.keys(contractors).map(k => k + ' (' + contractors[k] + ' ใบงาน)').join(' · ') || '-')}</td></tr>
  <tr><td>วันที่ตรวจรับงาน</td><td>${accDates.length
      ? (accDates[0] === accDates[accDates.length-1]
          ? esc(thaiDate(accDates[0]))
          : esc(thaiDate(accDates[0])) + ' ถึง ' + esc(thaiDate(accDates[accDates.length-1])))
      : '……………………'}</td></tr>
  <tr><td>ผู้ควบคุมงาน</td><td>${esc(sg.supervisorName || '……………………')}</td></tr>
</table>

<h2>๑. ผลการดำเนินงาน</h2>
<p>ผู้รับจ้างได้ดำเนินการตัดต้นไม้ใกล้แนวระบบจำหน่ายตามใบงานที่ปรากฏในข้อ ๒ รอบที่ ${esc(r.installment)}
รวม ${esc(r.count)} ใบงาน ระยะทางตามแผนรวม ${fmt(km)} กิโลเมตร
${all ? 'ดำเนินการแล้วเสร็จ ' + esc(cut) + ' ไลน์ จากทั้งหมด ' + esc(all) + ' ไลน์ ' : ''}คณะกรรมการได้ตรวจรับงานแล้ว
เห็นว่าถูกต้องครบถ้วนตามรูปแบบและข้อกำหนดของการไฟฟ้าส่วนภูมิภาค</p>

<h2>๒. รายละเอียดใบงานและจำนวนเงินที่ขอเบิกจ่าย</h2>
<table>
  <thead><tr>
    <th style="width:11mm">ที่</th><th style="width:28mm">เลขที่ใบงาน</th>
    <th>ชื่องาน</th><th style="width:20mm" class="nw">ฟีดเดอร์</th>
    <th style="width:28mm">ผู้รับจ้าง</th><th style="width:15mm">ร้อยละ</th>
    <th style="width:28mm">จำนวนเงิน<br>(บาท)</th></tr></thead>
  <tbody>
    ${r.items.map((it,i) => `<tr>
      <td class="c">${i+1}</td>
      <td class="nw">${esc(it.mjmNo)}</td>
      <td>${esc(it.jobName)}</td>
      <td class="c nw">${esc(it.feeder)}</td>
      <td>${esc(it.contractor || '-')}</td>
      <td class="c">${esc(it.percent)}</td>
      <td class="n">${fmt(it.amount)}</td></tr>`).join('')}
    <tr><td colspan="6" style="text-align:right;font-weight:700">รวมเป็นเงินทั้งสิ้น</td>
        <td class="n amt">${fmt(r.total)}</td></tr>
  </tbody>
</table>
<p>(${esc(r.totalText)})</p>
<p class="note">จำนวนเงินแต่ละใบงานคิดจากราคาตามสัญญาของใบงานนั้น แบ่งจ่ายสามงวด ร้อยละ 40, 40 และ 20 ตามลำดับ</p>

<h2>๓. ความเห็นของคณะกรรมการตรวจรับ</h2>
<p>คณะกรรมการตรวจรับได้ตรวจสอบผลงานทุกใบงานข้างต้นแล้ว เห็นควรอนุมัติเบิกจ่ายเงินให้แก่ผู้รับจ้างตามจำนวนข้างต้น</p>

<div class="signs">
  ${cm.length ? cm.map(c => sign(c.Name, c.Position, c.Role)).join('')
    : sign('', '', 'ประธานกรรมการ') + sign('', '', 'กรรมการ') + sign('', '', 'กรรมการ')}
</div>

<div class="signs" style="margin-top:9mm">
  ${sign(sg.supervisorName, sg.supervisorPos || 'ผู้ควบคุมงาน', '')}
  ${sign(sg.managerName, sg.managerPos || 'ผู้จัดการ', '')}
</div>

</body></html>`;
}

/* ---------- 3. รายชื่อคณะกรรมการ แยกตามปี ---------- */
let CMM = { year:'', rows:[] };

async function openCommittee(year){
  CMM.year = String(year || S.year);
  openSheet('คณะกรรมการตรวจรับ', 'ปี ' + CMM.year, `<div id="cmBody">${skCard(3)}${skCard(3)}</div>`);
  try{
    const out = await tree2('committeeGet', {year: CMM.year});
    CMM.rows = (out.rows || []).map(r => ({
      name: r.Name || '', position: r.Position || '', role: r.Role || 'กรรมการ'
    }));
    if(!CMM.rows.length) CMM.rows = [{name:'',position:'',role:'ประธาน'},
                                     {name:'',position:'',role:'กรรมการ'},
                                     {name:'',position:'',role:'กรรมการ'}];
    committeeRender();
  }catch(e){ $('#cmBody').innerHTML = `<div class="card"><div class="sub">${esc(e.message)}</div></div>`; }
}

function committeeRender(){
  $('#cmBody').innerHTML = `
    <div class="card">
      <div class="sub" style="margin-bottom:10px">ประธานหนึ่งคน ที่เหลือเป็นกรรมการ เพิ่มหรือลดได้ตามคำสั่งแต่งตั้งของแต่ละปี</div>
      ${CMM.rows.map((c,i) => `
        <div style="padding:10px 0;border-top:1px solid var(--line2)">
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
            <span class="pill ${c.role.indexOf('ประธาน')>=0?'p-ok':'p-gray'}">คนที่ ${i+1}</span>
            <select class="inp" style="flex:1;height:34px" onchange="CMM.rows[${i}].role=this.value;committeeRender()">
              <option ${c.role.indexOf('ประธาน')>=0?'selected':''}>ประธาน</option>
              <option ${c.role.indexOf('ประธาน')>=0?'':'selected'}>กรรมการ</option>
            </select>
            <button class="btn ghost" style="height:34px;padding:0 10px" onclick="CMM.rows.splice(${i},1);committeeRender()">ลบ</button>
          </div>
          <input class="inp" style="width:100%;margin-bottom:6px" placeholder="ชื่อ นามสกุล"
            value="${esc(c.name)}" oninput="CMM.rows[${i}].name=this.value">
          <input class="inp" style="width:100%" placeholder="ตำแหน่ง เช่น หัวหน้าแผนกปฏิบัติการระบบไฟฟ้า"
            value="${esc(c.position)}" oninput="CMM.rows[${i}].position=this.value">
        </div>`).join('')}
      <button class="btn ghost" style="margin-top:12px;width:100%;height:38px"
        onclick="CMM.rows.push({name:'',position:'',role:'กรรมการ'});committeeRender()">เพิ่มกรรมการ</button>
      <button class="btn" style="margin-top:10px;width:100%;height:44px" onclick="committeeSave()">บันทึกรายชื่อปี ${esc(CMM.year)}</button>
    </div>`;
}

async function committeeSave(){
  const list = CMM.rows.filter(c => String(c.name).trim() !== '');
  if(!list.length){ toast('ยังไม่ได้ใส่ชื่อ'); return; }
  const chair = list.filter(c => c.role.indexOf('ประธาน') >= 0);
  if(chair.length !== 1){ toast('ต้องมีประธานหนึ่งคนเท่านั้น'); return; }
  try{
    await tree2('committeeSave', {year: CMM.year, members: list});
    markDirty();
    toast('บันทึกรายชื่อปี ' + CMM.year + ' แล้ว');
    closeSheet();
  }catch(e){ toast(e.message, 4500); }
}

/* ============ เริ่มทำงาน ============ */
(function init(){
  const a = localStorage.getItem(LS+'_auth');
  if(a){
    try{
      const o = JSON.parse(a);
      S.user = o.user; S.token = o.token;
      startApp().then(()=>{ flushQueue(); logAppOpen(); });
      return;
    }catch(e){ /* ข้อมูลเสีย ให้เข้าสู่ระบบใหม่ */ }
  }
  const c = hubCreds();
  if(c.name) $('#uname').value = c.name;
  let skip = false;
  try{ skip = !!sessionStorage.getItem('tree_skipauto'); }catch(e){}
  if(!skip && c.name && c.pass){
    splash('กำลังเข้าสู่ระบบด้วยบัญชีศูนย์รวมงาน…');
    autoLogin(c.name, c.pass);
  }else{
    showLogin();
  }
})();
</script>
